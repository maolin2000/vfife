# Fiber RC column, cyclic — Tanaka & Park (1990) specimen No. 1
#
# Replaces a self-assembled reference (1.5 m, 0.25x0.35, 4Φ16, C35) whose
# contract said in as many words: "Upgrade it only against a number someone
# else published." This is that number. Every quantity below comes from the
# PEER Structural Performance Database sheet for this specimen; the measured
# hysteresis is verification/Tanaka_90_specimen_1.txt (593 points, mm and kN).
#
#   Tanaka, H.; and Park, R., "Effect of Lateral Confining Reinforcement on the
#   Ductile Behavior of Reinforced Concrete Columns", Report 90-2, Department of
#   Civil Engineering, University of Canterbury, June 1990.
#
# SPECIMEN
#   section     400 x 400 mm, clear cover 40 mm
#   length      1600 mm to the point of inflection (the test was double ended,
#               so this models one half of it as a cantilever)
#   concrete    f'c = 25.6 MPa
#   longitudinal 8 no. 20 mm (4 corner + 1 per face), fy = 474, fu = 721 MPa
#               As = 8 x 314 = 2513 mm^2, ratio 0.0157 -- matches the PEER sheet
#   transverse  12 mm rectangular hoops with J-hooks, 3 legs, spacing 80 mm,
#               volumetric ratio 0.025
#   axial       819 kN = 0.2 f'c Ag, held constant throughout
#   failure     flexural; crushing at 20 mm, spalling at 40 mm, bar buckling at
#               120 mm tip displacement
#
# HAND CHECK of the lateral capacity, before trusting anything the solver says
#   bar centroid  40 (cover) + 12 (hoop) + 10 (bar radius) = 62 mm from the
#                 face, so y,z = +-0.138 m
#   tension steel 3 bars on the tension face = 942 mm^2 at fy -> T = 446 kN
#   compression   3 bars likewise -> C_s = 446 kN; the 2 side bars sit at
#                 mid-depth and carry almost no moment
#   concrete      C_c = N + T - C_s = 819 kN, so a = 819e3/(0.85*25.6*400)
#                 = 94 mm, acting 47 mm from the compression face
#   moment        819*0.153 + 446*0.138 + 446*0.138 = 248 kN.m
#   shear         V = 248/1.6 = 155 kN
#   measured      167 kN peak. The 7% shortfall is strain hardening (fu/fy =
#                 1.52) and confinement, neither of which the hand check has.
#   -> the model should land between these, nearer 167. If it comes out at 60
#      or at 400, something is wrong with the input, not with the concrete.
#
# WHY b = 0.005 AND NOT fu/fy
#   b is the hardening ratio E_h/E0. The obvious reading of the PEER sheet is
#   to fit it to fu/fy = 721/474 = 1.52 over a 10% strain range, which gives
#   b ~ 0.012, and that is what this case used at first.
#
#   It is wrong under cyclic loading, and monotonic checks cannot see why.
#   A moment-curvature of this section, driven monotonically, is almost
#   indifferent to b: 0.012 -> 0 moves the capacity 1%. Driven through the
#   same cyclic curvature history it is not, because the Giuffre-Menegotto-
#   Pinto asymptote is re-anchored at every reversal and the offsets
#   accumulate. Measured on this section: monotonic peak steel stress 610 MPa,
#   cyclic 709 MPa -- the bars are pushed to within 2% of their measured
#   ultimate 721 MPa at only +-3.5% drift, which is not physical.
#
#   b = 0.005 puts the cyclic peak at 593 MPa and costs 3% of lateral
#   capacity. The reason to prefer it is the stress level, NOT the 3%: fitting
#   b to close the gap against the measured peak force would be tuning one
#   parameter to hide two missing mechanisms (cover spalling and bond slip).
#   Those are still missing, and the model is still ~10% strong because of it.
#
# WHY 4 ELEMENTS AND NOT 8
#   Measured, not chosen for elegance. At 8 elements of 200 mm the staged
#   relaxation stalls in the first cyclic stage: the residual sits at 1.5e-02
#   after 3000 iterations having been 1.8e-02 after 600, with ~1500 kinetic
#   resets, and the diagnostics put the worst residual on the LATERAL DOF of a
#   mid-height node (node 4, dof 2, 9.7 kN) -- interior lateral equilibrium the
#   solver cannot reach, not an axial or material problem. 6 elements of 267 mm
#   converge but cost ~9 s per load stage; 4 elements of 400 mm converge at
#   ~3 s. The fictitious mass for relaxation is row-sum(K)/safety^2, and
#   shortening the elements of a section this stiff raises that row sum
#   steeply, so the lateral modes get heavy and stop making progress.
#   The price is a 400 mm element against a 400 mm section depth -- one h,
#   where the plastic hinge is about 0.5h. lobatto3 puts an integration point
#   exactly at the fixed end so base yielding is still captured, but hinge
#   SPREAD is resolved by a single element and the curvature there is an
#   average. Treat the post-yield stiffness as indicative.
#
# WHY ny=16 AND nz=8
#   Under Euler-Bernoulli kinematics with the load along one axis only, fibre
#   STRAIN varies with one section coordinate and is constant along the other,
#   so for strain alone nz=2 would do and this case used it. Cover and core
#   changed that: the MATERIAL now varies with z as well, and nz=2 cannot see
#   it -- every fibre spans half the depth and is part cover, part core. At
#   nz=2 the cover comes out 25% of the section against a true 45%.
#   nz=8 gives 43.8%, and nz=16 gives the same 43.8%, so 8 is where it
#   converges. The cost is 128 concrete fibres against 32, which the fused
#   kernel absorbs.
#
#   THE AXIS IS STILL EASY TO GET BACKWARDS. The head is pushed along global z
#   and the obvious reading is that strain varies with the section's z; the
#   element's local y is global z here, so bending uses the fibre y coordinate.
#   An early version had ny=2, nz=16 -- two fibre layers through the depth --
#   which inflated the section capacity 9%. Verify, do not assume: run the case
#   and check that `bending_y` is ~1e-11 while `bending_z` carries the moment.
#   `vfife info` prints Iy and Iz; confirming the wrong one against a hand
#   calculation proves nothing, and that also happened here.
#
# WHAT IS STILL MISSING
#   Bond slip and bar buckling. The bars are strain-compatible with the
#   concrete at every section, so the fixed-end rotation from bar pullout is
#   absent, and nothing stops a bar in compression -- the test lost capacity to
#   buckling past 120 mm and this model will not follow it down.
name: case_11_fiber_rc_column_cyclic
units: {length: m, force: N, stress: Pa}
mesh: {type: gmsh, path: ../benchmarks/assets/fiber_rc_column_tanaka_4elem.msh}
element:
  type: beam2_fiber
  formulation: full
  fiber_section:
    type: rect
    width: 0.4
    height: 0.4
    ny: 16
    nz: 8
    # Clear cover 40 + 12 hoop = 52 mm to the core boundary. Fibres whose
    # centroid falls outside the 296 x 296 core carry `material` below (the
    # unconfined cover, which spalls); the rest carry `core_material`.
    cover: 0.052
    # Mander for this cage, derived not fitted:
    #   bc = hc = 400 - 2x40 - 12 = 308 mm, Ash = 3 legs x 113 = 339 mm^2
    #   rho_x = rho_y = 0.01377, rho_s = 0.0275, fl = 4.59 MPa
    #   ke = 0.8043 x 0.8896^2 / (1 - 0.0265) = 0.654
    #   fl' = 3.00 MPa, fl'/f'c = 0.117
    #   fcc = f'c(-1.254 + 2.254 sqrt(1 + 7.94 x 0.117) - 2 x 0.117) = 1.643 f'c
    #   eps_cc = 0.002 (1 + 5 (1.643 - 1)) = 0.0084
    #   eps_cu = 0.004 + 1.4 rho_s fyh eps_su / fcc = 0.0345  (Priestley)
    #   fcu at eps_cu taken as 0.2 fcc, the usual eps_20 convention
    core_material: {type: concrete02, fpc: 42.06e6, epsc0: 0.0084,
                    fcu: 8.4e6, epscu: 0.0345,
                    ft: 3.1e6, Ets: 1.2e9, rat: 0.1, rho: 2400}
  fiber_integration: lobatto3
  # Strain penetration at the footing. The bar does not stop straining at the
  # member face: it keeps going for Lsp = 0.022 fy db = 0.022 x 474 x 20 =
  # 209 mm into the anchorage (Priestley). Over the 400 mm base element the
  # bar therefore takes Le/(Le + Lsp) = 0.657 of the section strain, which is
  # softer and yields later. Nothing here is fitted -- Lsp comes out of fy and
  # db, both on the PEER sheet.
  #
  # It is a parameter of steel02, not a separate slip material, because the
  # fused kernel inlines one rebar law; a second law type would put the whole
  # model back on the NumPy path.
  strain_penetration: {region: base, bar_diameter: 0.020}
  fiber_rebars:
    # 4 corner bars
    - {y:  0.138, z:  0.138, area: 3.1416e-4, material: &rebar {type: steel02, E: 200.0e9, Fy: 474.0e6, b: 0.005, R0: 20.0, rho: 7850}}
    - {y: -0.138, z:  0.138, area: 3.1416e-4, material: *rebar}
    - {y:  0.138, z: -0.138, area: 3.1416e-4, material: *rebar}
    - {y: -0.138, z: -0.138, area: 3.1416e-4, material: *rebar}
    # 1 intermediate bar per face
    - {y:  0.0,   z:  0.138, area: 3.1416e-4, material: *rebar}
    - {y:  0.0,   z: -0.138, area: 3.1416e-4, material: *rebar}
    - {y:  0.138, z:  0.0,   area: 3.1416e-4, material: *rebar}
    - {y: -0.138, z:  0.0,   area: 3.1416e-4, material: *rebar}
material:
  type: concrete02
  # 25.6 MPa is a CYLINDER strength (confirmed against the source; Canterbury
  # tested cylinders, and the PEER sheet reports it as measured). No cube-to-
  # prism conversion applies. Worth stating because it is the first thing an
  # over-strong result invites you to suspect -- and it would be the wrong
  # lever anyway: this section is steel-and-axial dominated, and cutting f'c by
  # 40% moves the capacity only 7% (the compression block just gets deeper
  # while C_c stays fixed at 819 kN by equilibrium).
  fpc: 25.6e6          # unconfined peak, per the PEER sheet
  epsc0: 0.002
  # This is now the COVER only, so it is unconfined and it spalls: no residual
  # to speak of past 0.005 strain. The previous single-material compromise --
  # peak from the unconfined cover, residual and ultimate strain borrowed from
  # the confined core -- is gone, and with it the guesswork it needed.
  fcu: 0.1e6
  epscu: 0.005
  ft: 3.1e6            # 0.62 sqrt(f'c)
  Ets: 1.2e9
  rat: 0.1
  rho: 2400
regions:
  base: {box: [-0.01, 0.01, -0.01, 0.01, -0.01, 0.01]}
  head: {box: [1.59, 1.61, -0.01, 0.01, -0.01, 0.01]}
constraints:
  - {region: base, dofs: [1, 1, 1, 1, 1, 1]}
loads:
  # Model level, so it ramps on during step 1 and holds for the rest -- which
  # is what "the column carries 819 kN throughout" means. The column axis is x.
  - {region: head, vector: [-819.0e3, 0.0, 0.0]}
amplitudes:
  # The peaks the specimen was actually taken to, read off the measured record:
  # +-8, +-21, +-42, +-64, +-86 mm, two cycles at each level.
  drift: {cyclic: {peaks: [0.008, 0.021, 0.042, 0.064, 0.086], repeats: 2}}
steps:
  - name: axial
    # Ramping a constant load onto an uncracked column: 12 stages is plenty.
    # Before the solver honoured per-step load_steps this inherited the 480
    # meant for the cyclic protocol and cost 40x what it needed to.
    load_steps: 12
    max_steps_per_load: 8000
  - name: cyclic
    constraints:
      - {region: head, dofs: [0, 0, 1, 0, 0, 0], value: 1.0, amplitude: drift}
  - name: push
    # The test finished with a single monotonic push to 129.5 mm (8.1% drift),
    # past bar buckling at 120 mm -- which is why the measured force falls away
    # there and the model, having no buckling, will not follow it down.
    constraints:
      - {region: head, dofs: [0, 0, 1, 0, 0, 0], value: 0.1295}
    load_steps: 40
solver:
  backend: numpy       # the only value beam2_fiber accepts -- but the NumPy
                       # path now dispatches to a fused numba kernel when the
                       # section is one concrete plus one rebar law, which this
                       # one is. `vfife info` does not say so; the solver's
                       # kernel_status does.
  # Default for any step that does not set its own; the cyclic step uses it.
  load_steps: 480
  max_steps_per_load: 3000
  mode: relaxation
  tolerance: 5.0e-4
  # The kinetic criterion is kr = KE / (|F| |q|), and in the axial step |q| is
  # almost zero (0.32 mm of shortening) while |F| is the full 819 kN, so the
  # denominator collapses and the default 1e-10 becomes unreachable -- the
  # residual is 2e-05 there, twenty times inside tolerance, with the kinetic
  # measure still reading 8e-07. The residual criterion is doing the real work
  # in this analysis; this relaxes the companion check rather than pretending
  # a converged state has not converged.
  kinetic_tolerance: 1.0e-6
  n_steps: 100
output:
  path: results/case_11_fiber_rc_column_cyclic.h5
  every: 1
  # reaction_moment is here so the base moment can be cross-checked against
  # the base shear without another 100-minute run: statics says
  # M_base = V*L + P*delta, and a solved frame that does not satisfy it is
  # telling you something. The element field `bending_z` does NOT currently
  # satisfy it frame by frame (median ratio ~1.0 but only 10% of frames within
  # 10%), which is unexplained -- see the contract.
  fields: [displacement, rotation, reaction_force, reaction_moment, axial_force, bending_y, bending_z]
  monitors:
    tip_disp: {kind: displacement, region: head, dof: z}
    base_shear: {kind: reaction, region: base, dof: z}
