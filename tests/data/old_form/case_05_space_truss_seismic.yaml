# Four-leg spatial pyramid truss under the public El Centro 1940 N-S record.
name: case_05_space_truss_seismic
units: {length: m, force: N, stress: Pa}
mesh: {type: gmsh, path: ../benchmarks/assets/space_truss_pyramid_v22.msh}
element: {type: truss2, formulation: full, area: 2.0e-3}
material: {type: linear_elastic, E: 2.0e11, nu: 0.30, rho: 7850.0}
# Equipment/deck mass concentrated at the top joint, in addition to bar mass.
nodal_masses:
  - {region: apex, mass: 5000.0, per_node: true}
constraints:
  - {region: base, dofs: [1, 1, 1]}
loads:
  - region: all
    ground_motion:
      path: ../benchmarks/assets/elcentro_1940_ns_g.dat
      direction: [1, 0, 0]
      scale: 9.80665                 # source acceleration is in g
solver:
  mode: dynamic
  backend: numpy
  total_time: 31.18
  dt_safety: 0.55
  # Approx. 2% damping near the first apex translational mode.
  damping: {type: rayleigh, alpha: 2.0, beta: 1.0e-4}
output:
  path: results/case_05_space_truss_seismic.h5
  every: 10
  fields: [displacement, axial_stress, axial_force, von_mises]
  monitors:
    apex_ux: {kind: displacement, region: apex, dof: x}
    base_fx: {kind: reaction, region: base, dof: x}
