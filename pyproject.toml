[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vfife"
version = "1.23.2"
description = "Explicit structural solver (VFIFE) for bridges, from construction stages to earthquake and collapse"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["finite element", "VFIFE", "bridge", "explicit dynamics", "dynamic relaxation", "fibre beam",
            "progressive collapse", "seismic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
# Lower bounds: the oldest versions CI tests (.github/minimum-versions.txt).
# Upper bounds: the next major version, which may break the API; within them the
# weekly CI run installs the newest releases, so a breaking one is seen there.
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "h5py>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-xdist>=3.0", "ruff>=0.4"]   # check_all runs the pytest layers on --jobs processes
plot = ["matplotlib>=3.6,<4"]   # `vfife plot`; `vfife export` needs nothing extra
cpu = ["numba>=0.59,<1"]        # fused CPU kernel
gpu = ["warp-lang>=1.16,<2"]    # GPU backend (Windows + CUDA supported)
paraview = ["meshio>=5.3,<6"]     # `vfife sweep` and `vfife modal --paraview` (.pvd/.vtu export)

[project.urls]
Repository = "https://github.com/maolin2000/vfife"
Changelog = "https://github.com/maolin2000/vfife/blob/master/CHANGELOG.md"

[project.scripts]
vfife = "vfife.cli:main"

[tool.setuptools.packages.find]
include = ["vfife*"]

[tool.setuptools.package-data]
# the scenario templates of `vfife new` (1.2)
vfife = ["templates/*.yaml"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# What is held (tests/test_lint.py): names that do not exist, imports nobody
# uses, syntax that changed meaning. Style is not: the code writes several
# short statements on a line where they are one thought, and the kernels keep
# the names of the formulas they come from.
select = ["F", "E9"]
ignore = ["F841"]      # a tuple unpacked for one of its parts names the others

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]          # re-exports
"vfife/kernels/warp_*.py" = ["F401"]   # an import that initialises Warp, or fails early without it

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
# Solving eleven shipped cases takes minutes, so those runs are opt-in and the
# default suite stays fast. Everything ABOUT the cases that can be checked
# without solving -- they parse, they preflight, their contracts line up with
# their monitors -- runs every time, because that is what actually rots.
#     pytest -m slow          just the full-solve verification
#     pytest -m ""            everything
# A test is moved out of the default layer not because it is slow but because
# the nightly run covers the same thing and a cheaper fast-tier test guards the
# same subsystem. A check that quietly stops running is no check, so sentinel
# tests (relaxation convergence, backend parity, erosion end to end) stay in
# the default layer even when they are not cheap.
markers = ["slow: solves to convergence; deselected by default, run by `pytest -m slow` and nightly CI",
           "heavy: over 3 s (tests/heavy_tests.txt); in the default layer, left out of the GitHub fast tier"]
addopts = "-m 'not slow'"
