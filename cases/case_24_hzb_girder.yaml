# Hangzhou Bay Bridge, one 3 x 70 m continuous unit of the 70 m precast
# box girders: prestress, dead load, and the proportional live load of the
# thesis it is compared with.
#
#   Chen Hengzhi, "Computational analysis of large-span prestressed
#   concrete box girder structures", PhD thesis, Zhejiang University,
#   2005, §6.6: the 70 m girder's section (Fig. 6.25c, the same section as
#   Xu's Fig. 2.4 -- see case_24b), the tendon scheme of the design (Fig.
#   6.25b), the dead loads q_d1 = 306 kN/m (the girder) and q_d2 = 52 kN/m
#   (pavement, barriers), the JTG D60-2004 lane load F_L = 818 kN and
#   q_L = 25 kN/m, and the proportional push to failure:
#     load case 1   k F_L at the middle span's midspan, k q_L over the
#                   middle span:  k_u = 16.8, delta_u = 727 mm at that point
#     load case 2   k F_L 40 m from the abutment, k q_L over that side
#                   span:  k_u = 11.3, delta = 384 mm under the load
#   and Fig. 6.29, the strain state before the push, top and bottom fibres
#   at the side-span midspan, the middle-span midspan and the pier, with
#   and without the construction sequence.
#
# THIS FILE is the serviceability half: prestress + dead load, then the
# live load of case 1 to k = 10, every stage an equilibrium point on the
# load-deflection curve. The push to failure is case_24c (a dynamic ramp,
# because a load-controlled solution has no way past the peak).
#
# mode: static since 1.7: the implicit solver takes the
# fourteen levels in a few seconds instead of a minute of relaxation, to the
# same contract.
#
# THE MODEL
#   42 elements of 5 m, three stations each (lobatto3: a station AT the
#   piers and the midspans), the `patches` section of case_24b with C50
#   concrete (concrete02: f_c = 32.4 MPa, eps_0 = 0.0019 so that E_c0 =
#   3.41e10, f_t = 2.65 MPa), 389 phi 16 bars at 15 cm lumped in 48 rows
#   (steel02, f_y = 335 MPa), and Chen's strands as bonded tendons (steel02,
#   f_y = 1580 MPa, hardening 1.23e4 MPa -> b = 0.063, as his §6.6):
#   ONE ENTRY PER DUCT -- 110 of them, 426 strands per span and 264 per
#   pier, each with its own (y, z) profile:
#     per span    W1, W2, W4, W5 27 strands, W3 12, ONE DUCT IN EACH WEB
#                 (10 per span): draped, anchored 3.0 / 2.5 / 2.05 / 1.55 /
#                 1.05 m above the soffit, down at ~0.1 m/m to 0.72 / 0.60 /
#                 0.47 / 0.35 / 0.35 m at 24 / 21 / 18 / 14 / 12 m from the
#                 end, flat between, symmetric (Fig. 6.25b and 6.25c). A web
#                 duct sits at the middle of the 0.512 m web, so it also
#                 MOVES SIDEWAYS as it rises -- |z| 3.03 m at the low point,
#                 3.52 at the anchor -- and its friction counts that plan
#                 angle (1% more loss than the same duct drawn straight).
#                 Bottom slab, per side: 3 x B1 (19 strands) at |z| = 1.90,
#                 2.20, 2.50 and 3 x B2 (12) at 0.50, 1.00, 1.50, the order
#                 Fig. 6.25c shows. 59 640 mm2, 83 MN at the jack.
#     per pier    T1-T11 on both halves in the top slab, 22 x 12 strands:
#                 |z| = 2.38 .. 5.16 m at 0.28 m spacing, MEASURED off the
#                 plan panel of Fig. 6.25b, the outermost being the longest.
#                 Four half-lengths, 9 / 15 / 22 / 32 m from the pier
#                 (`extent`), which is the resolution the elevation gives.
#                 36 960 mm2, 52 MN.
#   Lumping each group into one row on the centreline -- the first version
#   of this file -- changes nothing in the vertical plane (the transverse
#   coordinate enters only I_z and the torsion): every dead-load strain
#   moves by less than 0.2% and the k = 10 deflection by 0.1%. It changes
#   the PICTURE, the friction, and anything lateral, which is why the ducts
#   are where they are.
#   Jacking stress 1395 MPa (0.75 f_pk) less a flat 10% for relaxation,
#   shrinkage and creep -- Chen's loss accounting is not in the thesis --
#   with friction mu = 0.25, k = 0.0015/m, 6 mm anchor set, both ends, and
#   the elastic shortening the model computes. The cap tendons are too
#   short for a 6 mm seat to spread by reflection alone, so they carry a
#   stated stress: 1256 - E 0.006 / L (the seat over the whole tendon)
#   - 1256 k L / 4 (the mean friction) = 1182 / 1203 / 1207 / 1204 MPa
#   for 18 / 30 / 44 / 64 m. The dead load is the stated
#   306 + 52 kN/m as a line load (the fibre section weighs 243 kN/m: the
#   end thickening and the diaphragms are not in it).
#
# k = 0 OF THE LIVE LOAD IS NOT THE ORIGIN: the dead load and the
#   prestress are on, and the girder sits 5.9 mm down at the middle
#   midspan -- a 70 m prestressed span is designed to be near level under
#   permanent load. Chen's Fig. 6.30(a) starts at 21.3 mm, and that 15 mm
#   is his construction sequence, not a discrepancy: his q_d1 acts on a
#   SIMPLY SUPPORTED 70 m span (126 mm down) against the same span's
#   tendon camber (114 mm up), while a girder continuous from the start
#   takes 0.00052 q L^4 / EI in the interior span, a twenty-fifth of the
#   simply supported value. The contract does that arithmetic, and
#   benchmarks/plot_hzb_k_delta.py compares the curves as increments from
#   each one's own k = 0 (the model is a flat 0.65-0.72 of Chen's).
#
# NOT STAGED. Chen's girder is precast simply supported under q_d1 and
#   made continuous afterwards; this model is continuous from the start,
#   which is his "不考虑施工过程" column of Fig. 6.29. The ultimate load of
#   a ductile continuous beam is a mechanism and does not depend on the
#   sequence; the strain state and the deflection at a given k do. The
#   strains the contract holds are that column: side midspan -306/-147,
#   middle midspan -294/-163, pier -242/-265 microstrain (top/bottom).
#
#   vfife run cases/case_24_hzb_girder.yaml
#   vfife verify cases/case_24_hzb_girder.yaml
#   vfife sweep cases/case_24_hzb_girder.yaml     # the cracking pattern at k = 10

