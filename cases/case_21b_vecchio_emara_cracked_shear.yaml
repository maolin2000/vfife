# case_21b -- Vecchio & Emara's frame with cracked shear.
#
# case_21 with one change: each member's shear is the cracking law in series
# with its fibres instead of the uncracked kappa G A. Uncracked it is the
# same 1.25e9 N; from the moment a member's concrete cracks in flexure its
# shear stiffness is the 45-degree truss of its stirrups (Park & Paulay 1975,
# sec. 7.3): No.10 @ 125, two legs, rho_v = 0.0053, n = 6.67,
#     GA_cr = rho_v / (1 + 4 n rho_v) E_s b_w d = 9.8e7 N (beams, d = 350)
#                                                 1.01e8 N (columns, d = 360)
# 8% of the uncracked value. Nothing is fitted: every number is the
# specimen's (see case_21's header for the test, the geometry and the
# measured curve), and the contract asks what case_21's "missing shear" was
# worth.
#
# backend numba since 1.7: the cracking shear law is in the
# fused fibre kernel, and the run that took 20 minutes on the NumPy reference
# takes half a minute. The NumPy path is still the reference (`backend:
# numpy` runs it; tests/test_fiber_shear.py checks the two agree).
version: 1
name: case_21b_vecchio_emara_cracked_shear
units: {length: m, force: N, stress: Pa}
mesh: {type: gmsh, path: ../benchmarks/assets/vecchio_emara_frame_8.msh}
materials:
  concrete:
    type: concrete02
    fpc: 3.0e+7
    epsc0: 0.002
    fcu: 6.0e+6
    epscu: 0.005
    ft: 2.0e+6
    Ets: 1.0e+9
    rat: 0.1
    rho: 2400
  core:
    # Mander for No.10 @ 125 in a 300 x 400 section: rho_s = 0.0096,
    # f_l' = 1.3 MPa, f'cc = 38 MPa, eps_cc = 0.0047, eps_cu ~ 0.02
    type: concrete02
    fpc: 3.8e+7
    epsc0: 0.0047
    fcu: 7.6e+6
    epscu: 0.02
    ft: 2.0e+6
    Ets: 1.0e+9
    rat: 0.1
    rho: 2400
  steel: {type: steel02, E: 1.925e+11, Fy: 4.18e+8, b: 0.01, R0: 20.0, rho: 7850}
sections:
  no20: {type: bar, material: steel, shape: general, area: 0.000314}
  # Beams and columns are the same 300 x 400 with the same eight No.20, and
  # differ in where the bars sit: 50 mm from the face in the beams (A-A),
  # 40 mm in the columns (B-B). Two sections, each with its own bars, core
  # and anchorage; the single-section form of v0.2 put the
  # bars at the mean 155 mm and gave a peak of 347 kN, 1 kN from this one.
  beam:
    type: fiber
    material: concrete
    shape: rect
    width: 0.3           # section y: out of the plane of the frame
    height: 0.4          # section z: the bending depth
    ny: 4
    nz: 16
    cover: 0.03
    core_material: core
    integration: lobatto3
    shear:
      stiffness: 1.25e9         # kappa G A: 5/6 x 12.5 GPa x 0.12 m^2, uncracked
      # No.10 @ 125, two legs: Park & Paulay's truss, d = 400 - 50
      stirrups: {area: 2.0e-4, spacing: 0.125, depth: 0.35, E: 2.0e+11}
    bars:
    - {y: 0.089, z: 0.150, section: no20}
    - {y: 0.030, z: 0.150, section: no20}
    - {y: -0.030, z: 0.150, section: no20}
    - {y: -0.089, z: 0.150, section: no20}
    - {y: 0.089, z: -0.150, section: no20}
    - {y: 0.030, z: -0.150, section: no20}
    - {y: -0.030, z: -0.150, section: no20}
    - {y: -0.089, z: -0.150, section: no20}
  column:
    type: fiber
    material: concrete
    shape: rect
    width: 0.3
    height: 0.4
    ny: 4
    nz: 16
    cover: 0.02
    core_material: core
    integration: lobatto3
    shear:
      stiffness: 1.25e9
      stirrups: {area: 2.0e-4, spacing: 0.125, depth: 0.36, E: 2.0e+11}
    bars:
    - {y: 0.089, z: 0.160, section: no20}
    - {y: 0.030, z: 0.160, section: no20}
    - {y: -0.030, z: 0.160, section: no20}
    - {y: -0.089, z: 0.160, section: no20}
    - {y: 0.089, z: -0.160, section: no20}
    - {y: 0.030, z: -0.160, section: no20}
    - {y: -0.030, z: -0.160, section: no20}
    - {y: -0.089, z: -0.160, section: no20}
assign:
- {region: columns, section: column, orientation: [0, 1, 0],
   anchorage: {region: joints, bar_diameter: 0.02}}
- {region: beams, section: beam, orientation: [0, 1, 0],
   anchorage: {region: joints, bar_diameter: 0.02}}
regions:
  # an element is a column element when BOTH its nodes lie on a column line
  columns: {union: [column_l, column_r]}
  column_l: {box: [-0.01, 0.01, -1, 1, -0.01, 4.01]}
  column_r: {box: [3.49, 3.51, -1, 1, -0.01, 4.01]}
  beams: {union: [beam_1, beam_2]}
  beam_1: {box: [-0.01, 3.51, -1, 1, 1.99, 2.01]}
  beam_2: {box: [-0.01, 3.51, -1, 1, 3.99, 4.01]}
  bases: {union: [base_l, base_r]}
  tops: {union: [top_l, top_r]}
  # the six beam-column joints (the bases count: the base beam is a joint)
  joint_1l: {box: [-0.01, 0.01, -1, 1, 1.99, 2.01]}
  joint_1r: {box: [3.49, 3.51, -1, 1, 1.99, 2.01]}
  joints: {union: [bases, tops, joint_1l, joint_1r]}
constraints:
- {region: bases, dofs: [1, 1, 1, 1, 1, 1]}
- {region: all, dofs: [0, 1, 0, 1, 0, 1]}      # a plane frame
loads:
# `vector` is the TOTAL over the region (README, loads), so one load per
# column top, not one over `tops` -- that would be 350 kN each
- {region: top_l, vector: [0.0, 0.0, -700000.0]}
- {region: top_r, vector: [0.0, 0.0, -700000.0]}
steps:
- {name: axial, load_steps: 4, max_steps_per_load: 6000}
- name: push
  constraints:
  - {region: top_l, dofs: [1, 0, 0, 0, 0, 0], value: 0.155}
  load_steps: 31
solver:
  backend: numba
  mode: relaxation
  max_steps_per_load: 6000
  tolerance: 0.0005
  kinetic_tolerance: 1.0e-6
  n_steps: 100
output:
  path: results/case_21b_vecchio_emara_cracked_shear.h5
  every: 1
  fields: [displacement, rotation, reaction_force, axial_force, bending_y, bending_z,
           fiber_stress, fiber_damage]   # what `vfife sweep` paints the frame with
  monitors:
    drift: {kind: displacement, region: top_l, dof: x}
    base_shear: {kind: reaction, region: bases, dof: x}
