# case_24f IN THREE DIMENSIONS: the same unit on its piers and pot bearings,
# with the plane-frame restraint removed, under the same dead load and
# prestress. It is the check `_hzb_seismic_3d`'s header quotes: a symmetric
# structure under a symmetric load must not notice the release, so every
# in-plane monitor must match case_24f's and the extra ones (v_mid_middle,
# v_pier_top, T_pier_base) must stay at zero.
#
# THE PIERS (笔记-杭州湾中引桥的墩与耐久性参数.md, 章汉斌 and 王仁贵; the
#   section from 调研：四篇新墩身文献)
#   474 precast shafts, 7.372 to 17.383 m tall, 240 to 440 t. This case takes
#   a 12.0 m shaft, the middle of that range. The section is read, not
#   assumed: HOLLOW, 6.25 m across the bridge, 2.60 m along it at the base
#   growing to 4.00 m at the top, walls 0.50 m -- six elements, one section
#   each, carrying a linear taper between the two stated end depths. That is
#   7.97 to 9.13 m2 and about 256 t over the 12 m, inside the stated weights.
#   (Until v0.4's re-cut the header described v0.4's back-calculated
#   solid 6.25 x 1.80 m, 4.4x too soft along the bridge; the section block
#   below says what it read.)
#
# ONE ASSUMED NUMBER: THE LONGITUDINAL STEEL, 0.6% of the gross area. That is
#   a CODE MINIMUM for a bridge pier rather than a figure from the drawings,
#   which is why it is a floor and not a guess: a real shaft has at least
#   this much.
#
# THE CONNECTION IS THE REAL ONE: POT BEARINGS. The pier
#   top has its own node 0.5 m below the girder and a `connector2` joins them:
#   fixed pot on one pier, sliding pot on the other, stiffnesses from
#   case_24e (whose header says where they come from). The rotation about the
#   transverse axis is released, so the prestress shortening goes into the
#   sliding bearing instead of bending the shafts. case_24d is the monolithic
#   member of the pair: -27.77 mm of middle-span dead deflection there against
#   -7.98 here.
#
# NO SELF-WEIGHT ON THE PIERS. case_24c applies the dead load as a line load on
#   the girder, not as gravity, so the shafts carry the girder's reaction and
#   not their own ~256 t. At the base that is about 10% of each shaft's axial
#   load.
#
#   python benchmarks/generate_hzb_girder.py              # the meshes (6 pier elements)
#   vfife run cases/_hzb_3d_dead.yaml

