# Li et al., Buildings 14 (2024) 3322, beam A0: the uncorroded control of a
# campaign of eight post-tensioned scaled T-beams.
#
# WHY THIS CAMPAIGN CARRIES THE CAPACITY CHECK. Two independent campaigns of
# corroded scaled beams were digitised for this project; only this one's
# flexural capacities are physically attainable. Kuang et al. (2023) report
# 76.14 kN m for their uncorroded L1, which on a 250 mm deep beam whose steel
# can develop at most 305.4 kN needs an internal lever arm of 249.4 mm -- the
# compression resultant on the top surface and the tension resultant on the
# soffit at once. Their own section analysis in the same table says 49.43 and
# this library says 54.59. B's table closes instead: 145.0 kN of applied load
# is exactly twice the 72.5 kN of measured support reaction, and
# 72.5 x 0.850 = 61.63 kN m needs 0.200 m of lever arm on a 240 mm beam.
# benchmarks/generate_corroded_pc_beam.py --check prints both audits;
# case_30 is what is left of A (a cracking check).
#
# THE TARGETS, all from Table 2 and section 3.2 of the paper:
#
#   ultimate load            145.0 kN        (= 2 x 72.5 kN reaction)
#   flexural capacity         61.63 kN m
#   cracking moment       approx 22   kN m   ("A0-A3 is approximately 22")
#
# THE ONE CALIBRATED NUMBER is the effective prestress. The paper gives the
# tensioning procedure and a 12 mm elongation over a 2020 mm strand -- which
# is 162 kN of jacking force -- and publishes no loss breakdown. For a 2 m
# tendon that is not a detail: 2 mm of anchorage set alone is 9.6e-4 of strain
# and 17% of the force. The effective force below is therefore BACK-CALCULATED
# from the paper's own cracking moment and is the only fitted quantity in the
# case. It implies 33% of total loss, against 18% obtained the same way on
# Kuang's beam. That is a wide spread for two campaigns from one laboratory,
# and the reason to distrust it is on THIS side: Kuang publishes 23.58 kN m
# for one beam and this paper publishes "approximately 22" for four at once.
#
# AND IT DOES NOT BUY THE ANSWER -- which is the point of doing it this way.
# The flexural capacity of a BONDED tendon is set by what the steel is, not by
# how hard it was pulled, and the model says so:
#
#     effective prestress    105 kN    123.5 kN     140 kN
#     (a 50-step ladder, the three comparable with each other; the case
#      itself runs 109.0 kN on a denser 60-step one)
#     ultimate load        137.87 kN   137.98 kN   137.81 kN
#     cracking moment       21.10 kN m  25.20 kN m  26.97 kN m
#     camber                 0.935 mm    1.126 mm    1.308 mm
#
# A THIRD of the calibrated quantity moves the capacity by 0.12% -- which is
# the size of the solver's own scatter, not a trend; the middle value is the
# largest of the three. Over the same range the cracking moment moves 28% and
# the camber 40%. So the calibration is spent entirely on the cracking check,
# and the capacity check -- the one this case exists for -- is free.
# (The two ends are this case with `prestress` set to 7.500e+08 and
# 1.000e+09 and nothing else changed.)
#
# WHAT IS ASSUMED BECAUSE THE PAPER DOES NOT SAY. B states "C50 high-
# performance concrete" with the same mix proportions, the same materials and
# the same 1x7-15.2-1860 strand as Kuang's campaign, but publishes no measured
# strengths. Kuang's measured values are used throughout and named as such:
# f_cu 45.24 MPa, f_py 1834, f_pu 1872, E_p 1.95e5, HRB335 322.4/430.4 MPa.
#
#   python benchmarks/generate_corroded_pc_beam.py
#   python benchmarks/generate_corroded_pc_beam.py --check

version: 1
name: case_31_li_control_beam
units: {length: m, force: N, stress: Pa}
mesh: {type: gmsh, path: ../benchmarks/assets/corroded_pc_beam_B.msh}

materials:
  # Kuang's measured 28-day cube strength 45.24 MPa for the same mix.
  # concrete02 wants the CYLINDER peak, taken as 0.79 f_cu = 35.7 MPa;
  # f_t = 0.395 f_cu^0.55 = 3.22 MPa is the Chinese code's axial tensile
  # strength for that cube value.
  concrete: {type: concrete02, fpc: 3.57e+7, epsc0: 0.002, fcu: 7.1e+6, epscu: 0.0045,
             ft: 3.22e+6, Ets: 1.6e+9, rat: 0.1, rho: 2500}
  # 1x7-15.2-1860, Kuang Table 3: f_py 1834, f_pu 1872 MPa, E 1.95e5. The
  # hardening slope is what those two give over a 2.6% strain range.
  strand: {type: steel02, E: 1.95e+11, Fy: 1.834e+9, b: 0.008, R0: 20.0, rho: 7850}
  rebar: {type: steel02, E: 2.0e+11, Fy: 3.224e+8, b: 0.0055, R0: 20.0, rho: 7850}

sections:
  phi8: {type: bar, material: rebar, area: 5.027e-5}
  strand15: {type: bar, material: strand, area: 1.40e-4}

  # Figure 1: a T of 265 x 75 on a web 89 wide at midspan and 155 at the
  # supports, 240 deep. y = 0 is the MIDSPAN centroid, 151.5 mm above the
  # soffit; the support section's own centroid is 135.0, so its patches sit
  # 16.5 mm high on this datum. That is the beam, not an idealisation: the
  # soffit and the top face are straight and it is the centroid that moves.
  girder_mid: &mid
    type: fiber
    material: concrete
    shape: patches
    integration: lobatto3
    j: 1.0e-4
    patches:
      - {corners: [[0.0135, -0.1325], [0.0135, 0.1325], [0.0885, 0.1325], [0.0885, -0.1325]], ny: 4, nz: 10}
      - {corners: [[-0.1515, -0.0445], [-0.1515, 0.0445], [0.0135, 0.0445], [0.0135, -0.0445]], ny: 12, nz: 4}
    bars:
      # Figure 3: 8 phi 8 in the flange in TWO layers of four inside a 225 mm
      # stirrup, and 2 phi 8 at the soffit flanking the duct. The flange bars'
      # z-spread is drawn and not dimensioned; an even spread is used, and
      # they are in compression throughout.
      - {y: 0.0645, z: -0.1125, section: phi8, count: 1}
      - {y: 0.0645, z: -0.0375, section: phi8, count: 1}
      - {y: 0.0645, z: 0.0375, section: phi8, count: 1}
      - {y: 0.0645, z: 0.1125, section: phi8, count: 1}
      - {y: 0.0295, z: -0.1125, section: phi8, count: 1}
      - {y: 0.0295, z: -0.0375, section: phi8, count: 1}
      - {y: 0.0295, z: 0.0375, section: phi8, count: 1}
      - {y: 0.0295, z: 0.1125, section: phi8, count: 1}
      - {y: -0.1275, z: -0.022, section: phi8, count: 1}
      - {y: -0.1275, z: 0.022, section: phi8, count: 1}
    tendons:
      # Draped and GROUTED over the whole length: flat at 33 mm above the
      # soffit between the tapers, rising to 74 at the ends (Figure 3 labels,
      # confirmed by measuring the duct circle at 600 dpi -- 33.3 and 71.8 --
      # and at midspan by the construction: 20 mm cover plus half of the
      # 25 mm duct is 32.5).
      - section: strand15
        profile: [[0.0, -0.0775, 0.0], [0.279, -0.1185, 0.0],
                  [1.741, -0.1185, 0.0], [2.020, -0.0775, 0.0]]
        extent: [0.0, 2.020]
        prestress: 7.786e+08          # 109.0 kN / 140 mm2 -- CALIBRATED, see header
        elastic_shortening: compensate
  girder_sup:
    <<: *mid
    patches:
      - {corners: [[0.0135, -0.1325], [0.0135, 0.1325], [0.0885, 0.1325], [0.0885, -0.1325]], ny: 4, nz: 10}
      - {corners: [[-0.1515, -0.0775], [-0.1515, 0.0775], [0.0135, 0.0775], [0.0135, -0.0775]], ny: 12, nz: 6}

assign:
- {region: web_wide_l, section: girder_sup, orientation: [0, 0, 1]}
- {region: web_narrow, section: girder_mid, orientation: [0, 0, 1]}
- {region: web_wide_r, section: girder_sup, orientation: [0, 0, 1]}

regions:
  beam: {union: [web_wide_l, web_narrow, web_wide_r]}
  loads: {union: [load_l, load_r]}

constraints:
- {region: all, dofs: [0, 1, 0, 1, 0, 1]}      # a plane beam
- {region: left, dofs: [1, 1, 1, 1, 0, 1]}     # pin
- {region: right, dofs: [0, 1, 1, 1, 0, 1]}    # roller

loads:
- {region: beam, gravity: [0.0, 0.0, -9.80665]}

amplitudes:
  # ONE LOADING STAGE, AND THE CURVE IS WHY. The load points are pushed down
  # by prescribed displacement, and a prescribed displacement is ABSOLUTE --
  # it is measured from the undeformed mesh, not from wherever the transfer
  # left the beam. A stage that ramps 0 -> -0.040 therefore spends its first
  # step undoing the camber, and on the first version of case_30 that single
  # step went from +0.9 mm of camber to -0.3 mm and landed at 81 kN, with the
  # measured cracking load of 72 kN somewhere inside it and no frame anywhere
  # near it. Splitting the stage in two does not help: the second stage's
  # ramp restarts at zero, so the beam unloads to 1.5 mm and reloads along a
  # cracked secant, and the curve doubles back on itself.
  #
  # So: one stage, and an amplitude that STARTS AT THE CAMBER (factor -0.0239
  # of -0.040 m is +0.96 mm, the transfer's own load-point rise) and is dense
  # where the answer is. The first frame then reads about zero load, which is
  # also a check on the camber -- if it drifts, the first frame says so.
  #
  # THE FIRST SEGMENT'S DENSITY IS SET BY HOW THE CONTRACT READS CRACKING, not
  # by what the curve needs to look right. `reduction: at` interpolates
  # LINEARLY between the two frames that bracket the cracking strain -- and
  # those two frames sit on different branches, one on the uncracked line and
  # one already softening. The interpolation therefore always reads the
  # cracking load LOW, by about half a step. At 14 kN per step it read 44.5 kN
  # where the uncracked branch extrapolates to 52.9; at 6 kN per step the bias
  # is inside the tolerance. This is a property of the reduction, not of the
  # model, and the contract says which way it leans.
  press: [[0.00, -0.0239], [0.30, 0.035], [0.70, 0.450], [1.00, 1.000]]

steps:
- {name: transfer, load_steps: 4}
- name: press
  load_steps: 60
  constraints:
  - {region: loads, dofs: [0, 0, 1, 0, 0, 0], value: -0.040, amplitude: press}

solver:
  backend: numpy
  mode: relaxation
  n_steps: 100
  max_steps_per_load: 150000
  tolerance: 1.0e-5
  kinetic_tolerance: 1.0e-9
  # The DEFAULT 0.6. case_30 spent a while at 0.9 because the prestress
  # transfer crawled; the cause was a 5 mm element in the mesh, not the
  # safety factor, and at 0.9 the loading stage then fails outright -- once a
  # concrete fibre cracks the tangent flips between the softening branch and
  # the unloading one from iteration to iteration, the kinetic damping resets
  # on every step, and the residual parks at 2e-2. Both prestress transfer
  # and crack propagation want the step bound respected.
  relaxation_safety: 0.6
  damping: {type: kinetic}

output:
  path: results/case_31_li_control_beam.h5
  every: 1
  fields: [displacement, axial_force, bending_z, fiber_stress, fiber_damage]
  monitors:
    w_mid: {kind: displacement, region: mid, dof: z}
    # THE TOTAL is what the test measures: one hydraulic jack on a distribution
    # steel beam. P_left and P_right are carried too, and their SPLIT is the
    # honest limit of this idealisation -- a spreader beam equalises FORCES
    # while two prescribed displacements equalise DISPLACEMENTS. Up to the
    # peak the response is symmetric and the two agree to the last digit; past
    # it the softening localises to one side and they diverge (see the run log). So the
    # peak is sound and the DESCENDING BRANCH is not held by the contract.
    P_tot: {kind: reaction, region: loads, dof: z}
    P_left: {kind: reaction, region: load_l, dof: z}
    P_right: {kind: reaction, region: load_r, dof: z}
    R_left: {kind: reaction, region: left, dof: z}
    # CRACKING IS JUDGED ON STRAIN. `field: stress` returns the closest
    # FIBRE's stress, which after that fibre cracks is on the softening
    # branch and says nothing about when it cracked; the strain is exact at
    # (y, z) by plane-section kinematics. The soffit cracks when eps_bot
    # reaches f_t / E0 = 3.22e6 / 3.57e10 = 9.02e-5.
    eps_bot: {kind: fiber, region: mid, field: strain, at: [-0.1515, 0.0]}
    eps_top: {kind: fiber, region: mid, field: strain, at: [0.0885, 0.0]}
    eps_p: {kind: fiber, region: mid, field: strain, at: [-0.1185, 0.0]}
    sig_bot: {kind: fiber, region: mid, field: stress, at: [-0.1515, 0.0]}
