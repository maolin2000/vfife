# --------------------------------------------------------------------------- #
#  THE SAME UNIT, SHAKEN ACROSS THE BRIDGE.  The 3-D twin of `_hzb_seismic`.
#
#  WHAT CHANGED: one line went away -- `{region: all, dofs: [0,1,0,1,0,1]}`,
#  the plane-frame lock. Nothing else. Both fibre sections already carry BOTH
#  bending axes (the literature pier reads Iy = 29.7 to 39.3 m4 across the
#  bridge against Iz = 8.2 to 19.7 along it, and both declare a torsion
#  constant), so the transverse model needs no new section and no new
#  property.
#
#  WHAT THE RUN GIVES: transverse base shear 22.6 MN, 0.30
#  of the dead load, at 4.7 Hz -- high because the keepers are rigid (see
#  below); midspan 17.5 mm across, pier top 11.3 mm; both pier bases cracked,
#  one or two bar points yielded at 5.02 s; the girder cracks near both
#  abutments. The in-plane reactions this shaking seems to produce -- 5.0 MN
#  of longitudinal base shear, the pier axial force swinging 31-70 MN -- are
#  ringing above the 170 Hz monitor rate, not coupling: a 5 Hz low-pass leaves
#  0.39 MN and 1.2 MN of them. The energy audit read 0.77; with the damping
#  booked and the lag removed the first 7 s stay within 4e-4.
#
#  THE RELEASE IS CHECKED ON THE DEAD STATE (`_hzb_3d_dead`), which must not
#  notice it: a symmetric structure under a symmetric load stays in its
#  plane. It does, to the digit (literature pier) --
#
#      w_mid_side   -2.111307e-2  against the plane frame's -2.111306e-2
#      N_pier_base   5.163637e+7  against             5.163637e+7
#      u_pier_top    2.660444e-3  against             2.660444e-3
#
#  -- and the new transverse monitors read 2.6 um and 2.5 kN against 51.6 MN.
#
#  WHAT IT COSTS (re-measured in v0.4 on the literature pier; the first
#  version of this paragraph was the solid 1.80 m shaft's): the stable step
#  is 2.9415e-5 s against the plane frame's 4.2060e-5 s, so 31.18 s of record
#  is 1 060 018 steps instead of 741 323 -- x1.43. (On the solid shaft it was
#  3.4541e-5 against 1.1833e-4, x3.4: the literature pier is 4.4x stiffer
#  ALONG the bridge, which pulled the plane frame's step down 2.8x, and about
#  as stiff ACROSS it, so the 3-D step barely moved and the ratio closed.)
#  The governing DOF is still `uy` AT THE PIER-TOP NODE (z = -0.50): it
#  carries half a pier element and nothing else, while the pier's transverse
#  direction is its STRONG axis; the next one is the first shaft node,
#  z = -2.42, only 17% behind. Each step is 3.3 ms since v0.4 stacked the
#  bearings' Jacobian (12.6 ms before, 80% of it the two connectors).
#
#  AND THE NUMBER THAT NOW DECIDES THE ANSWER: the bearings' TRANSVERSE
#  stiffness, the third entry of `stiffness` (local z, across the bridge).
#  Longitudinally the sensitive assumption was the bearing's VERTICAL
#  stiffness and it did nothing to what was being measured. Here it
#  is not a second-order thing -- it IS the answer. An elastic probe, 1 MN in
#  +y at every girder node:
#
#      k_transverse   mid span    pier top   girder at the pier   (mm)
#        1e13           10.46        5.75           6.11
#        1e11 (HERE)    10.62        5.75           6.24
#        1e10           12.07        5.71           7.41
#        1e9            25.60        5.35          18.26
#        1e8           103.31        3.28          80.60
#        1e7           201.20        0.67         159.12
#
#  THE DECISION (tian, this session): this unit HAS transverse keepers at the
#  piers and they are treated as rigid. 1e11 rather than 1e10, because 1e10
#  sits ON the knee -- one decade softer doubles the transverse midspan, while
#  1e11 to 1e13 moves it 1.5%. A "rigid keeper" belongs on the plateau, not at
#  its edge.
#  IT IS STILL AN ASSUMPTION WITH NO SOURCE, like the pier wall thickness
#  (worth 10%) and the bearing's vertical stiffness (worth
#  230% of the dead deflection). Unlike those two, this one IS the answer
#  being computed, so the sweep above travels with any number quoted from
#  this case -- it is not a footnote.
#
#  THE PIER-CAP MASS IS NOT THE LEVER, and v0.4 guessed that it was. That
#  note left "give the pier-top node the cap and bearing mass it actually has"
#  as the first thing to try for the step bound. Measured, with mass added at
#  both pier tops (the node carries 27.1 t today, half the first pier
#  element):
#
#      + 40 t / 80 t / 400 t / 2000 t  ->  dt x1.15, x1.15, x1.15, x1.15
#
#  It SATURATES immediately, because the bound moves off the pier top
#  (z = -0.50) onto a pier SHAFT node (z = -8.17) that no cap mass touches.
#  Same x1.15 in the longitudinal 2-D model. (Measured on the solid shaft; on
#  the literature pier the next node is z = -2.42 at x1.17, the same
#  conclusion.) So the cap would buy 15% at the price of a mass with no source
#  sitting exactly where transverse seismic inertia matters most. Not a trade
#  worth making, and v0.4's suggestion is withdrawn.
#
#  WHAT DOES BUY TIME WITHOUT AN ASSUMPTION: the record's own tail. El Centro's
#  5-95% Arias duration is 1.6 to 25.5 s; the first 20 s carries 87.4% of the
#  energy and the first 25 s carries 94.0%. `total_time: 25.0` costs 20% of
#  the run for 6% of the energy -- but check that the peak response time is
#  inside the window before trusting a truncated run.
# --------------------------------------------------------------------------- #
# --------------------------------------------------------------------------- #
#  THE SAME UNIT, SHAKEN.  Run it AFTER case_24f and --restart from its result:
#  a seismic run has to start from the dead + prestress state, not from an
#  unloaded, uncambered girder.
#
#      python -m vfife run cases/case_24f_hzb_girder_bearings.yaml
#      python -m vfife run cases/_hzb_seismic.yaml \
#             --restart results/case_24f_hzb_girder_bearings.h5
#
#  NOT A VERIFIED CASE. It has no `verification/` contract and no published
#  record behind it, which is why its name starts with an underscore and the
#  test suite skips it. What it is: a working template, with every mechanism
#  in it exercised, for the 地震 stage the route has not done yet.
#
#  WHAT IS REAL HERE
#    * `ground_motion` on `beam2_fiber` works -- checked against `gravity`:
#      a constant a_g = -9.80665 in +z gives exactly the mirror of gravity
#      (tip +1.08503e-2 m against -1.08508e-2, base reaction -3.671e4 against
#      +3.664e4). It had never been run on a fibre model before.
#    * The bearings are the ones v0.4 put in, so the girder is no longer
#      welded to the piers and the seismic path girder -> bearing -> pier is
#      the real one.
#
#  WHAT IS NOT
#    * THIS IS A PLANE FRAME, so there is no transverse direction to shake.
#      `{region: all, dofs: [0, 1, 0, 1, 0, 1]}` below locks `uy` at every one
#      of the 57 nodes, and `direction: [0, 1, 0]` would put the whole of
#      `-m a_g` into the reactions: the run converges, every monitor is flat,
#      and nothing says why. Preflight refuses it now
#      (GROUND_MOTION_FULLY_RESTRAINED). For the transverse component the
#      model itself has to change.
#    * UNIFORM EXCITATION ONLY. The implementation adds -m a_g(t) to every
#      node in the relative frame, which is the textbook formulation and is
#      right only when every support moves together. No multi-support
#      excitation, no travelling wave, no soil-structure interaction, no pile
#      or cap flexibility -- the pier bases are built in.
#    * LINEAR BEARINGS. `connector2` v1 has no gap, no friction and no
#      hysteresis, so the "sliding" pot here is a secant stiffness, not a
#      friction pendulum. This is NOT an isolation analysis.
#    * RAYLEIGH beta MULTIPLIES THE INITIAL K, which is the usual choice but
#      over-damps once the section softens -- and it SHRINKS the stable step.
#      Start with alpha only and add beta deliberately.
#    * THE RECORD IS EL CENTRO, which is a convention, not a hazard
#      assessment. Nothing here says 1940 Imperial Valley is the right input
#      for a Hangzhou Bay site, and the 0.3188 g is unscaled -- no site
#      spectrum, no scaling factor, no set of seven records. It is the record
#      everyone recognises, which makes it good for checking that the model
#      behaves and bad for a design statement. Point `path` elsewhere and the
#      format is two whitespace columns: seconds, then acceleration in the
#      unit that `scale` multiplies to m/s^2.
# --------------------------------------------------------------------------- #
version: 1
