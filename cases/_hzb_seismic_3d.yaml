      - {section: duct12, profile: [[61.0,1.3915,2.62],[79.0,1.3915,2.62]], extent: [61.0, 79.0], prestress: 1.182e+09}   # T2.62R_p1
      - {section: duct12, profile: [[61.0,1.3915,-2.38],[79.0,1.3915,-2.38]], extent: [61.0, 79.0], prestress: 1.182e+09}   # T2.38L_p1
      - {section: duct12, profile: [[61.0,1.3915,2.38],[79.0,1.3915,2.38]], extent: [61.0, 79.0], prestress: 1.182e+09}   # T2.38R_p1
      - {section: duct12, profile: [[108.0,1.3915,-5.16],[172.0,1.3915,-5.16]], extent: [108.0, 172.0], prestress: 1.207e+09}   # T5.16L_p2
      - {section: duct12, profile: [[108.0,1.3915,5.16],[172.0,1.3915,5.16]], extent: [108.0, 172.0], prestress: 1.207e+09}   # T5.16R_p2
      - {section: duct12, profile: [[108.0,1.3915,-4.88],[172.0,1.3915,-4.88]], extent: [108.0, 172.0], prestress: 1.207e+09}   # T4.88L_p2
      - {section: duct12, profile: [[108.0,1.3915,4.88],[172.0,1.3915,4.88]], extent: [108.0, 172.0], prestress: 1.207e+09}   # T4.88R_p2
      - {section: duct12, profile: [[118.0,1.3915,-4.6],[162.0,1.3915,-4.6]], extent: [118.0, 162.0], prestress: 1.208e+09}   # T4.6L_p2
      - {section: duct12, profile: [[118.0,1.3915,4.6],[162.0,1.3915,4.6]], extent: [118.0, 162.0], prestress: 1.208e+09}   # T4.6R_p2
      - {section: duct12, profile: [[118.0,1.3915,-4.35],[162.0,1.3915,-4.35]], extent: [118.0, 162.0], prestress: 1.208e+09}   # T4.35L_p2
      - {section: duct12, profile: [[118.0,1.3915,4.35],[162.0,1.3915,4.35]], extent: [118.0, 162.0], prestress: 1.208e+09}   # T4.35R_p2
      - {section: duct12, profile: [[118.0,1.3915,-4.07],[162.0,1.3915,-4.07]], extent: [118.0, 162.0], prestress: 1.208e+09}   # T4.07L_p2
      - {section: duct12, profile: [[118.0,1.3915,4.07],[162.0,1.3915,4.07]], extent: [118.0, 162.0], prestress: 1.208e+09}   # T4.07R_p2
      - {section: duct12, profile: [[125.0,1.3915,-3.67],[155.0,1.3915,-3.67]], extent: [125.0, 155.0], prestress: 1.202e+09}   # T3.67L_p2
      - {section: duct12, profile: [[125.0,1.3915,3.67],[155.0,1.3915,3.67]], extent: [125.0, 155.0], prestress: 1.202e+09}   # T3.67R_p2
      - {section: duct12, profile: [[125.0,1.3915,-3.43],[155.0,1.3915,-3.43]], extent: [125.0, 155.0], prestress: 1.202e+09}   # T3.43L_p2
      - {section: duct12, profile: [[125.0,1.3915,3.43],[155.0,1.3915,3.43]], extent: [125.0, 155.0], prestress: 1.202e+09}   # T3.43R_p2
      - {section: duct12, profile: [[125.0,1.3915,-3.19],[155.0,1.3915,-3.19]], extent: [125.0, 155.0], prestress: 1.202e+09}   # T3.19L_p2
      - {section: duct12, profile: [[125.0,1.3915,3.19],[155.0,1.3915,3.19]], extent: [125.0, 155.0], prestress: 1.202e+09}   # T3.19R_p2
      - {section: duct12, profile: [[131.0,1.3915,-2.9],[149.0,1.3915,-2.9]], extent: [131.0, 149.0], prestress: 1.182e+09}   # T2.9L_p2
      - {section: duct12, profile: [[131.0,1.3915,2.9],[149.0,1.3915,2.9]], extent: [131.0, 149.0], prestress: 1.182e+09}   # T2.9R_p2
      - {section: duct12, profile: [[131.0,1.3915,-2.62],[149.0,1.3915,-2.62]], extent: [131.0, 149.0], prestress: 1.182e+09}   # T2.62L_p2
      - {section: duct12, profile: [[131.0,1.3915,2.62],[149.0,1.3915,2.62]], extent: [131.0, 149.0], prestress: 1.182e+09}   # T2.62R_p2
      - {section: duct12, profile: [[131.0,1.3915,-2.38],[149.0,1.3915,-2.38]], extent: [131.0, 149.0], prestress: 1.182e+09}   # T2.38L_p2
      - {section: duct12, profile: [[131.0,1.3915,2.38],[149.0,1.3915,2.38]], extent: [131.0, 149.0], prestress: 1.182e+09}   # T2.38R_p2
  # [ux, uy, uz, rx, ry, rz] in the LOCAL frame of the link, whose x runs from
  # the girder node DOWN to the pier top. `orientation: [1, 0, 0]` puts local
  # y along the bridge, so ux is the bearing's VERTICAL stiffness, uy its
  # longitudinal one and rz the rotation about the transverse axis -- the one
  # a pot releases. The numbers are case_24e's, and case_24e's header says
  # where they came from and what they are worth.
  fixed_pot:
    type: connector
    material: concrete
    stiffness: [5.0e+10, 1.0e+9, 1.0e+11, 1.0e+10, 1.0e+10, 1.0e+7]
  sliding_pot:
    type: connector
    material: concrete
    stiffness: [5.0e+10, 7.1e+7, 1.0e+11, 1.0e+10, 1.0e+10, 1.0e+7]

assign:
  - {region: girder, section: girder, orientation: [0, 0, 1]}
  # the shaft's local y is the LONGITUDINAL direction, so the section's
  # 2.60-4.00 m depth is the one that bends in the plane of the frame
  - {region: pier1_seg1, section: pier1, orientation: [1, 0, 0]}
  - {region: pier2_seg1, section: pier1, orientation: [1, 0, 0]}
  - {region: pier1_seg2, section: pier2, orientation: [1, 0, 0]}
  - {region: pier2_seg2, section: pier2, orientation: [1, 0, 0]}
  - {region: pier1_seg3, section: pier3, orientation: [1, 0, 0]}
  - {region: pier2_seg3, section: pier3, orientation: [1, 0, 0]}
  - {region: pier1_seg4, section: pier4, orientation: [1, 0, 0]}
  - {region: pier2_seg4, section: pier4, orientation: [1, 0, 0]}
  - {region: pier1_seg5, section: pier5, orientation: [1, 0, 0]}
  - {region: pier2_seg5, section: pier5, orientation: [1, 0, 0]}
  - {region: pier1_seg6, section: pier6, orientation: [1, 0, 0]}
  - {region: pier2_seg6, section: pier6, orientation: [1, 0, 0]}
  - {region: bearing_1, section: fixed_pot, orientation: [1, 0, 0], coordinate_system: local}
  - {region: bearing_2, section: sliding_pot, orientation: [1, 0, 0], coordinate_system: local}

regions:
  # each box owns exactly one complete Line2: the bearing link, 0.5 m tall
  # directly under a pier node. The first pier-shaft element starts at -0.5
  # and runs to -2.42, so the z band excludes it.
  bearing_1: {box: [69.0, 71.0, -1.0, 1.0, -0.6, 0.1]}
  bearing_2: {box: [139.0, 141.0, -1.0, 1.0, -0.6, 0.1]}
  # the z band is tight so that no PIER element's midpoint falls in it
  middle_span: {box: [69.99, 140.01, -1.0, 1.0, -0.4, 0.4]}
  piers: {union: [pier_1, pier_2]}
  # ONE BOX PER PIER PER ELEMENT, generated from THIS case's own mesh.
  # The x window is +-1 m of the pier line, because a band that spanned the
  # deck would own the GIRDER elements at z = 0 wherever the pier top IS a
  # girder node (case_24d). Each box holds two consecutive pier nodes.
  pier1_seg1: {box: [69.0, 71.0, -1.0, 1.0, -2.4467, -0.4700]}
  pier2_seg1: {box: [139.0, 141.0, -1.0, 1.0, -2.4467, -0.4700]}
  pier1_seg2: {box: [69.0, 71.0, -1.0, 1.0, -4.3633, -2.3867]}
  pier2_seg2: {box: [139.0, 141.0, -1.0, 1.0, -4.3633, -2.3867]}
  pier1_seg3: {box: [69.0, 71.0, -1.0, 1.0, -6.2800, -4.3033]}
  pier2_seg3: {box: [139.0, 141.0, -1.0, 1.0, -6.2800, -4.3033]}
  pier1_seg4: {box: [69.0, 71.0, -1.0, 1.0, -8.1967, -6.2200]}
  pier2_seg4: {box: [139.0, 141.0, -1.0, 1.0, -8.1967, -6.2200]}
  pier1_seg5: {box: [69.0, 71.0, -1.0, 1.0, -10.1133, -8.1367]}
  pier2_seg5: {box: [139.0, 141.0, -1.0, 1.0, -10.1133, -8.1367]}
  pier1_seg6: {box: [69.0, 71.0, -1.0, 1.0, -12.0300, -10.0533]}
  pier2_seg6: {box: [139.0, 141.0, -1.0, 1.0, -12.0300, -10.0533]}
constraints:
  # THE PIERS NOW CARRY THE UNIT. Both abutments are rollers -- the pin moved
  # to the piers, which is where a real unit is fixed, except that here BOTH
  # of them are fixed because there is no sliding bearing (see the header).
  - {region: left, dofs: [0, 1, 1, 1, 0, 1]}
  - {region: right, dofs: [0, 1, 1, 1, 0, 1]}
  - {region: pier_base, dofs: [1, 1, 1, 1, 1, 1]}   # the cap on 9 phi 1.5 piles
loads:
  # `hold` = full value from t = 0. WITHOUT IT the default ramps the dead
  # load from zero over the earthquake, on top of a restart that already
  # carries its deflection -- the girder would rise and then be loaded again.
  - {region: girder, line_load: [0.0, 0.0, -3.58e+5], amplitude: hold}   # q_d1 + q_d2
  # TRANSVERSE shaking. This is the case the plane frame could not do:
  # `_hzb_seismic.yaml` locks uy at every node, so [0, 1, 0] there is
  # refused by preflight (GROUND_MOTION_FULLY_RESTRAINED).
  # EL CENTRO 1940 NS -- it was already in this repo (`case_05` uses it):
  # 1560 samples, dt 0.02 s, 31.18 s, PGA 0.3188 g at t = 2.02 s.
  # THE FILE IS IN UNITS OF g, so `scale: 9.80665` is what converts it to
  # m/s^2 -- leave it out and the unit is shaken at a tenth of gravity's
  # share and everything looks reassuringly small.
  - {region: all, ground_motion: {path: ../benchmarks/assets/elcentro_1940_ns_g.dat,
                                  direction: [0, 1, 0], scale: 9.80665}}
steps:
- {name: quake}

solver:
  backend: numpy          # promoted to the numba fused kernel automatically
  mode: dynamic
  total_time: 31.18
  # alpha * M * v only. 0.30 1/s is ~2.4% of critical at 1 Hz; set it from the
  # first period this unit actually has (`python -m vfife modal ...`), do not
  # copy this number.
  damping: {type: rayleigh, alpha: 0.30}
output:
  path: results/_hzb_seismic_3d.h5
  # OUTPUT IS THE COST HERE, NOT THE SOLVE. `every` governs the field frames
  # AND the monitor samples together (one `_record`), and `fiber_stress` +
  # `fiber_damage` are 56 x 324 x 3 doubles each -- 0.87 MB a frame against
  # about 0.01 MB for everything else. At `every: 40` that is 6588 frames and
  # ~5.9 GB, which is what killed the first attempt at this run.
  #   every: 200  -> 1318 frames, monitors at 42 Hz, on the solid shaft's step;
  #                  on the literature pier's 2.94e-5 s it is 5300 records at 170 Hz (this)
  #   every:  40  -> drop fiber_stress/fiber_damage and it is ~70 MB total,
  #                  monitors at 340 Hz, but `vfife sweep` has nothing to paint
  every: 200
  fields: [displacement, rotation, reaction_force, end_actions, fiber_stress, fiber_damage,
           connector_flag, connector_force_x, connector_force_y,
           connector_deformation_ux, connector_deformation_uy, connector_deformation_rz]
  monitors:
    w_mid_middle: {kind: displacement, region: mid_middle, dof: z}
    v_mid_middle: {kind: displacement, region: mid_middle, dof: y}
    v_mid_side: {kind: displacement, region: mid_side, dof: y}
    v_pier_top: {kind: displacement, region: pier_1, dof: y}
    T_pier_base: {kind: reaction, region: pier_base, dof: y}
    w_mid_side: {kind: displacement, region: mid_side, dof: z}
    w_40m: {kind: displacement, region: side_40m, dof: z}
    R_pier_1: {kind: reaction, region: pier_1, dof: z}
    N_pier_base: {kind: reaction, region: pier_base, dof: z}
    H_pier_base: {kind: reaction, region: pier_base, dof: x}
    u_pier_top: {kind: displacement, region: pier_1, dof: x}
    R_left: {kind: reaction, region: left, dof: z}
    # Fig. 6.29: the extreme-fibre strains, top (deck) and bottom (soffit)
    eps_side_top: {kind: fiber, region: mid_side, field: strain, at: [1.5215, 0.0]}
    eps_side_bot: {kind: fiber, region: mid_side, field: strain, at: [-2.4785, 0.0]}
    eps_mid_top: {kind: fiber, region: mid_middle, field: strain, at: [1.5215, 0.0]}
    eps_mid_bot: {kind: fiber, region: mid_middle, field: strain, at: [-2.4785, 0.0]}
    eps_pier_top: {kind: fiber, region: pier_1, field: strain, at: [1.5215, 0.0]}
    eps_pier_bot: {kind: fiber, region: pier_1, field: strain, at: [-2.4785, 0.0]}
    sig_mid_bot: {kind: fiber, region: mid_middle, field: stress, at: [-2.4785, 0.0]}
