assign: [{region: girder, section: girder}]
regions:
  middle_span: {box: [69.99, 140.01, -1.0, 1.0, -1.0, 1.0]}
  piers: {union: [pier_1, pier_2]}
constraints:
  - {region: all, dofs: [0, 1, 0, 1, 0, 1]}         # a plane girder
  - {region: left, dofs: [1, 1, 1, 1, 0, 1]}        # pin at the abutment
  - {region: piers, dofs: [0, 1, 1, 1, 0, 1]}       # rollers on the piers
  - {region: right, dofs: [0, 1, 1, 1, 0, 1]}
amplitudes:
  # THE DEAD LOAD IS THERE FROM t = 0, with the prestress, and the first
  # seconds damp the transient out. A RAMP IS WRONG HERE:
  # the tendons' prestrain cannot be ramped -- it is built into the fibres
  # at setup -- so a dead load that arrives over five seconds leaves the
  # girder sitting at FULL PRESTRESS WITH NO WEIGHT, which a precast
  # girder never is (transfer happens with the girder's weight on it), and
  # which cambers the side spans 62 mm up. concrete02 keeps the imprint:
  # the state the run then settled into was 44 microstrain softer in axial
  # and 7 / 16 mm higher at the midspans than the staged relaxation of
  # case_24 under the same load. Applied together, the two runs agree.
  dead: [[0.0, 1.0], [1.0, 1.0]]
  live: [[0.0, 0.0], [0.1666667, 0.0], [1.0, 20.0]]        # k = (t - 10) / 2.5, 0 .. 20
loads:
  - {region: girder, line_load: [0.0, 0.0, -3.58e+5], amplitude: dead}      # q_d1 + q_d2
  - {region: mid_middle, vector: [0.0, 0.0, -8.18e+5], amplitude: live}     # k F_L
  - {region: middle_span, line_load: [0.0, 0.0, -2.5e+4], amplitude: live}  # k q_L
solver:
  backend: numpy
  mode: dynamic
  total_time: 60.0
  damping: {type: viscous, coeff: 2.0}
output:
  path: results/case_24c_hzb_girder_collapse.h5
  every: 250
  fields: [displacement, rotation, reaction_force, end_actions, fiber_stress, fiber_damage]
  monitors:
    w_mid_middle: {kind: displacement, region: mid_middle, dof: z}
    w_mid_side: {kind: displacement, region: mid_side, dof: z}
    w_40m: {kind: displacement, region: side_40m, dof: z}
    R_pier_1: {kind: reaction, region: pier_1, dof: z}
    R_left: {kind: reaction, region: left, dof: z}
    # Fig. 6.29: the extreme-fibre strains, top (deck) and bottom (soffit)
    eps_side_top: {kind: fiber, region: mid_side, field: strain, at: [1.5215, 0.0]}
    eps_side_bot: {kind: fiber, region: mid_side, field: strain, at: [-2.4785, 0.0]}
    eps_mid_top: {kind: fiber, region: mid_middle, field: strain, at: [1.5215, 0.0]}
    eps_mid_bot: {kind: fiber, region: mid_middle, field: strain, at: [-2.4785, 0.0]}
    eps_pier_top: {kind: fiber, region: pier_1, field: strain, at: [1.5215, 0.0]}
    eps_pier_bot: {kind: fiber, region: pier_1, field: strain, at: [-2.4785, 0.0]}
    sig_mid_bot: {kind: fiber, region: mid_middle, field: stress, at: [-2.4785, 0.0]}
