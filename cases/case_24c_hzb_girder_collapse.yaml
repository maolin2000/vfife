# Hangzhou Bay Bridge 3 x 70 m unit, load case 1 pushed to failure: the
# collapse half of case_24. Same model; read that file.
#
# WHY DYNAMIC. Chen pushed the live load proportionally with an implicit
#   solver until it stopped converging, at k_u = 16.8 with 727 mm under the
#   load. A staged relaxation has no way past a limit point -- it can only
#   report the last level that converged, and how close that is to the
#   peak depends on the budget. So the push is a slow dynamic ramp: the
#   dead load and the prestress present from t = 0 and ten seconds to damp
#   the transient out (see `amplitudes`), then the live load of case 1 at
#   0.4 units of k per second, so k = (t - 10) / 2.5 and 16.8
#   arrives at t = 52 s; mass-proportional damping 2/s (~10% of critical
#   on the 1.8 Hz first mode). Below the peak the girder follows the load
#   quasi-statically -- inertia is a few kN against MN -- and the k(delta)
#   record is the load-deflection curve; past it the deflection runs away
#   at whatever k the mechanism formed. The contract reads the curve at
#   Chen's points, and where it runs away.
#
# k = 0 IS NOT THE ORIGIN. The dead load and the prestress are on, and the
#   girder sits 9 mm down at the middle midspan (case_24's relaxation:
#   5.9; Chen's Fig. 6.30(a) starts at 21.3 -- his delta is the total
#   deflection too, and the 15 mm between his dead state and this one is
#   his construction sequence; verification/case_24_hzb_girder.yaml does
#   that arithmetic). Comparing the two curves therefore means comparing
#   INCREMENTS from each one's own k = 0: benchmarks/plot_hzb_k_delta.py
#   prints the table and draws all three.
#
#   THIS RUN'S DEAD STATE IS NOT case_24's, by 3 mm and by 180
#   microstrain at the pier soffit, with the same loads and the same
#   reactions. concrete02 is path dependent and the start-up transient
#   cycles it: on a dead-load-only run, damping 2/s settles at 9.1 mm,
#   6/s at 8.7, 20/s (nearly critical) at 7.3, against the relaxation's
#   5.9. 2/s is what ships, so that the collapse is not damped out of
#   recognition; the 5% it costs at service load is in the contract.
#
# WHAT IT DOES. Quasi-static to k = 14.5 (287 mm), pier hinges at k = 14.8
#   and a snap to the strands' hardening branch (654 mm), a plateau to
#   k = 17.5, then the mechanism: 2 m at 18.1, 3.3 m at 20. Chen's single
#   16.8 at 727 mm sits inside that bracket (-12% / +3% / +8%).
#
#   vfife run cases/case_24c_hzb_girder_collapse.yaml      # ~7 min
#   python benchmarks/plot_hzb_k_delta.py                  # the comparison figure
#   vfife sweep cases/case_24c_hzb_girder_collapse.yaml    # hinges, crushing, yielded strands

