# NAFEMS LE10 — public linear-elastic 3-D solid benchmark.
# Reference at D=(2,0,0.6) m: sigma_yy = -5.38 MPa.

version: 1
name: case_04_nafems_le10
units: {length: m, force: N, stress: Pa}
mesh: {type: gmsh, path: ../benchmarks/assets/nafems_le10.msh}
materials:
  steel: {type: linear_elastic, E: 2.1e+11, nu: 0.3, rho: 7800.0}
sections:
  body: {type: solid, material: steel}
constraints:
- {region: DCDpCp, dofs: [0, 1, 0]}
- {region: ABApBp, dofs: [1, 0, 0]}
- {region: BCBpCp, dofs: [1, 1, 0]}
- {region: midplane, dofs: [0, 0, 1]}
loads:
- {region: upper, pressure: 1.0e+6}
solver:
  backend: numba
  mode: relaxation
  n_steps: 6000
  load_steps: 5
  max_steps_per_load: 1800
  stage_ramp_iterations: 180
  tolerance: 0.001
  damping: {type: kinetic}
output:
  path: results/case_04_nafems_le10.h5
  every: 100000
  fields: [displacement, stress, stress_nodal, sigma_xx, sigma_yy, sigma_zz, von_mises]
  monitors:
    upper_uz: {kind: displacement, region: upper, dof: z}
    outer_fz: {kind: reaction, region: BCBpCp, dof: z}
