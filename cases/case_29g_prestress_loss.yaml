# All three time-dependent losses on one pretensioned member, and what they do
# to each other.
#
# The same 10 m bar and the same centroidal tendon as case_29f, with the far
# end now FREE: the member is self-equilibrated, so it can shorten, and the
# three losses stop being independent.
#
#   * the concrete CREEPS under the precompression, the member shortens, and
#     the tendon -- which is bonded to it -- loses strain
#   * the concrete SHRINKS, and the tendon loses strain again
#   * the steel RELAXES on its own account
#
# and each of those relieves the concrete, which reduces the next. The total
# is therefore LESS than the sum of the three taken separately, which is the
# thing every hand method approximates and the reason the classical formula
# has a `1 + n(1 + chi phi)` in its denominator. Here the solver integrates it
# station by station instead, and `benchmarks/generate_creep_bar.py --check`
# prints the closed form to compare against.
#
# WHAT IS CHECKED, and against what:
#
#   the age-adjusted effective modulus method, derived in
#   generate_creep_bar.py from this file's own numbers, gives at 1028 days
#
#       chi = 0    141.99 kN     no relief at all from the stress change
#       chi = 0.8  146.04 kN     the usual fitted value
#       chi = 1.0  147.32 kN     the plain effective-modulus method
#
#   and chi = 0 and chi = 1 BRACKET the step-by-step integral by construction.
#   The contract reads the bracket and the neighbourhood of chi = 0.8; it is
#   not a check against algebra, because there is no algebra here -- the AAEM
#   is itself an approximation of what this case solves.
#
# WHY THE CONCRETE HAS epsc0 = 2.0. The bar must stay on a LINEAR branch for
# the closed form to mean anything, and concrete02's compression branch is the
# parabola `fc r (2 - r)` with `r = eps / epsc0`: putting the peak strain far
# outside the range used makes the branch straight to 0.02% over it, with
# `Ec = 2 fpc / epsc0 = 30.0 GPa` unchanged. case_29d does the same thing in
# tension, with ft instead. It is the real law on the real path -- and it has
# to be `concrete02`, because `linear_elastic` has no `strain_scale` and so
# cannot creep at all.
#
# THE ELASTIC SHORTENING IS LARGE HERE and is not a loss the time axis causes:
# 1488 MPa jacked becomes 1364 at transfer, because 208 kN on 0.01 m2 of
# concrete is 19 MPa of precompression. That is a test bar, not a beam. Every
# number below is measured from the post-transfer state.
#
#   python benchmarks/generate_creep_bar.py --check

version: 1
name: case_29g_prestress_loss
units: {length: m, force: N, stress: Pa}
mesh: {type: gmsh, path: ../benchmarks/assets/creep_bar_8.msh}

materials:
  concrete:
    type: concrete02
    fpc: 3.0e+10          # with epsc0 = 2.0 this is Ec = 2 fpc / epsc0 = 30 GPa
    epsc0: 2.0            # the peak, put far outside the range used: see header
    fcu: 6.0e+9
    epscu: 3.0
    ft: 1.0e+8
    Ets: 1.5e+9
    rat: 0.1
    rho: 2400.0
    # The standard linear solid of case_29, phi = 2 (1 - exp(-d/40 d)), and a
    # shrinkage curve of the same shape, eps_sh = -300 ue (1 - exp(-d/60 d)).
    # Both as measured `curve`s so that the closed form in
    # benchmarks/generate_creep_bar.py uses literally the same function.
    creep:
      model: curve
      curve: [[0, 0.00000], [0.5, 0.02484], [0.7081, 0.03509], [1.003, 0.04952], [1.42, 0.06976],
       [2.011, 0.09808], [2.848, 0.13747], [4.034, 0.19186], [5.713, 0.26618], [8.091, 0.36624],
       [11.46, 0.49815], [16.23, 0.66694], [22.98, 0.87404], [32.54, 1.11350], [46.09, 1.36815],
       [65.27, 1.60886], [92.44, 1.80168], [130.9, 1.92420], [185.4, 1.98059], [262.6, 1.99718],
       [371.8, 1.99982], [526.6, 2.00000], [745.8, 2.00000], [1056, 2.00000], [1496, 2.00000],
       [2118, 2.00000], [3000, 2.00000]]
    shrinkage:
      model: curve
      drying_start: 28.0
      curve: [[0, 0.0], [1.0, -4.959e-6], [2.0, -9.835e-6], [5.0, -2.398e-5], [10.0, -4.646e-5],
       [20.0, -8.504e-5], [40.0, -1.4600e-4], [60.0, -1.8964e-4], [100.0, -2.4327e-4],
       [150.0, -2.7541e-4], [200.0, -2.8930e-4], [300.0, -2.9798e-4], [500.0, -2.9976e-4],
       [1000.0, -3.00000e-4], [3000.0, -3.00000e-4]]
  strand:
    type: steel02
    E: 1.95e+11
    Fy: 1.674e+9
    b: 0.01
    R0: 20.0
    rho: 7850.0
    relaxation: {model: power, rho_1000: 0.031, k: 0.21}

sections:
  strand15: {type: bar, material: strand, area: 1.40e-4}
  bar:
    type: fiber
    material: concrete
    shape: rect
    width: 0.1
    height: 0.1
    ny: 4
    nz: 4
    integration: lobatto3
    tendons:
      - section: strand15
        profile: [[0.0, 0.0, 0.0], [10.0, 0.0, 0.0]]
        extent: [0.0, 10.0]
        prestress: 1.488e+9

assign:
- {region: bar, section: bar, orientation: [0, 0, 1]}

constraints:
- {region: all, dofs: [0, 1, 1, 1, 1, 1]}     # an axial problem: only ux is free
# ONE end only: the member is free to shorten, which is what makes the three
# losses interact. case_29f holds both and gets the intrinsic relaxation.
- {region: left, dofs: [1, 1, 1, 1, 1, 1]}

steps:
- {name: transfer, age: 28.0, load_steps: 1, max_steps_per_load: 40000}
- {name: service, to_age: 1028.0, load_steps: 12, max_steps_per_load: 40000}

solver:
  mode: relaxation
  backend: numpy
  n_steps: 400000
  age: 28.0
  damping: {type: kinetic}
  tolerance: 1.0e-6

output:
  path: results/case_29g_prestress_loss.h5
  every: 1
  fields: [displacement, axial_force, fiber_stress]
  monitors:
    u_right: {kind: displacement, region: right, dof: x}
    u_mid: {kind: displacement, region: mid, dof: x}
    sig_p: {kind: fiber, region: mid, field: stress, at: [0.0, 0.0]}
    eps_sec: {kind: fiber, region: mid, field: strain, at: [0.0, 0.0]}
