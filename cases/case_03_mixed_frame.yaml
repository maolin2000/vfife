version: 1
name: case_03_mixed_frame
units: {length: m, force: N, stress: Pa}
mesh: {type: gmsh, path: ../benchmarks/assets/mixed_frame_v22.msh}
materials:
  steel: {type: linear_elastic, E: 2.0e+11, nu: 0.3, rho: 7850.0}
sections:
  beam:
    type: beam
    material: steel
    shape: general
    area: 0.01
    iy: 0.0001
    iz: 0.0001
    j: 0.0002
  bar: {type: bar, material: steel, shape: general, area: 0.0001}
assign:
- {region: beam_members, section: beam, orientation: [0, 0, 1]}
- {region: truss_members, section: bar}
constraints:
- {region: fixed, dofs: [1, 1, 1, 1, 1, 1]}
- {region: loaded, dofs: [1, 1, 0, 1, 1, 1]}
loads:
- {region: loaded, vector: [0, 0, -1000]}
solver:
  mode: relaxation
  backend: numpy
  n_steps: 20000
  damping: {type: kinetic}
  relaxation_safety: 0.25
  tolerance: 1.0e-6
output:
  path: results/case_03_mixed_frame.h5
  every: 5000
  fields: [displacement, rotation, axial_force, bending_y, bending_z, member_type]
