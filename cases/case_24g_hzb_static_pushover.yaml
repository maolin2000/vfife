  # the shaft's local y is the LONGITUDINAL direction, so the section's
  # 2.60-4.00 m depth is the one that bends in the plane of the frame
  - {region: pier1_seg1, section: pier1, orientation: [1, 0, 0]}
  - {region: pier2_seg1, section: pier1, orientation: [1, 0, 0]}
  - {region: pier1_seg2, section: pier2, orientation: [1, 0, 0]}
  - {region: pier2_seg2, section: pier2, orientation: [1, 0, 0]}
  - {region: pier1_seg3, section: pier3, orientation: [1, 0, 0]}
  - {region: pier2_seg3, section: pier3, orientation: [1, 0, 0]}
  - {region: pier1_seg4, section: pier4, orientation: [1, 0, 0]}
  - {region: pier2_seg4, section: pier4, orientation: [1, 0, 0]}
  - {region: pier1_seg5, section: pier5, orientation: [1, 0, 0]}
  - {region: pier2_seg5, section: pier5, orientation: [1, 0, 0]}
  - {region: pier1_seg6, section: pier6, orientation: [1, 0, 0]}
  - {region: pier2_seg6, section: pier6, orientation: [1, 0, 0]}
regions:
  # the z band is tight so that no PIER element's midpoint falls in it
  middle_span: {box: [69.99, 140.01, -1.0, 1.0, -0.4, 0.4]}
  piers: {union: [pier_1, pier_2]}
  # ONE BOX PER PIER PER ELEMENT, generated from THIS case's own mesh.
  # The x window is +-1 m of the pier line, because a band that spanned the
  # deck would own the GIRDER elements at z = 0 wherever the pier top IS a
  # girder node (case_24d). Each box holds two consecutive pier nodes.
  pier1_seg1: {box: [69.0, 71.0, -1.0, 1.0, -2.0300, 0.0300]}
  pier2_seg1: {box: [139.0, 141.0, -1.0, 1.0, -2.0300, 0.0300]}
  pier1_seg2: {box: [69.0, 71.0, -1.0, 1.0, -4.0300, -1.9700]}
  pier2_seg2: {box: [139.0, 141.0, -1.0, 1.0, -4.0300, -1.9700]}
  pier1_seg3: {box: [69.0, 71.0, -1.0, 1.0, -6.0300, -3.9700]}
  pier2_seg3: {box: [139.0, 141.0, -1.0, 1.0, -6.0300, -3.9700]}
  pier1_seg4: {box: [69.0, 71.0, -1.0, 1.0, -8.0300, -5.9700]}
  pier2_seg4: {box: [139.0, 141.0, -1.0, 1.0, -8.0300, -5.9700]}
  pier1_seg5: {box: [69.0, 71.0, -1.0, 1.0, -10.0300, -7.9700]}
  pier2_seg5: {box: [139.0, 141.0, -1.0, 1.0, -10.0300, -7.9700]}
  pier1_seg6: {box: [69.0, 71.0, -1.0, 1.0, -12.0300, -9.9700]}
  pier2_seg6: {box: [139.0, 141.0, -1.0, 1.0, -12.0300, -9.9700]}
constraints:
  - {region: all, dofs: [0, 1, 0, 1, 0, 1]}         # a plane frame
  # THE PIERS NOW CARRY THE UNIT. Both abutments are rollers -- the pin moved
  # to the piers, which is where a real unit is fixed, except that here BOTH
  # of them are fixed because there is no sliding bearing (see the header).
  - {region: left, dofs: [0, 1, 1, 1, 0, 1]}
  - {region: right, dofs: [0, 1, 1, 1, 0, 1]}
  - {region: pier_base, dofs: [1, 1, 1, 1, 1, 1]}   # the cap on 9 phi 1.5 piles
amplitudes:
  # the dead load is there from the first evaluation, with the prestress
  # (case_24d's reason): no ramp from a weightless girder
  dead: [[0.0, 1.0], [1.0, 1.0]]
loads:
  - {region: girder, line_load: [0.0, 0.0, -3.58e+5], amplitude: dead}      # q_d1 + q_d2
steps:
  - name: dead                  # Newton, one level: the dead state
    load_steps: 1
  - name: live                  # arc length: k = 20 lambda
    loads:
      - {region: mid_middle, vector: [0.0, 0.0, -1.636e+7]}        # 20 F_L
      - {region: middle_span, line_load: [0.0, 0.0, -5.0e+5]}      # 20 q_L
solver:
  backend: numpy
  mode: static
  tolerance: 1.0e-5
  static:
    arc_length:
      initial: 0.05
      max_increments: 200
      target_iterations: 5
      steps: [live]
      stop: {region: mid_middle, dof: z, value: -0.38}
output:
  path: results/case_24g_hzb_static_pushover.h5
  every: 1
  fields: [displacement, rotation, reaction_force, end_actions, fiber_stress, fiber_damage]
  monitors:
    w_mid_middle: {kind: displacement, region: mid_middle, dof: z}
    w_mid_side: {kind: displacement, region: mid_side, dof: z}
    w_40m: {kind: displacement, region: side_40m, dof: z}
    R_pier_1: {kind: reaction, region: pier_1, dof: z}
    N_pier_base: {kind: reaction, region: pier_base, dof: z}
    H_pier_base: {kind: reaction, region: pier_base, dof: x}
    u_pier_top: {kind: displacement, region: pier_1, dof: x}
    R_left: {kind: reaction, region: left, dof: z}
    # Fig. 6.29: the extreme-fibre strains, top (deck) and bottom (soffit)
    eps_side_top: {kind: fiber, region: mid_side, field: strain, at: [1.5215, 0.0]}
    eps_side_bot: {kind: fiber, region: mid_side, field: strain, at: [-2.4785, 0.0]}
    eps_mid_top: {kind: fiber, region: mid_middle, field: strain, at: [1.5215, 0.0]}
    eps_mid_bot: {kind: fiber, region: mid_middle, field: strain, at: [-2.4785, 0.0]}
    eps_pier_top: {kind: fiber, region: pier_1, field: strain, at: [1.5215, 0.0]}
    eps_pier_bot: {kind: fiber, region: pier_1, field: strain, at: [-2.4785, 0.0]}
    sig_mid_bot: {kind: fiber, region: mid_middle, field: stress, at: [-2.4785, 0.0]}
