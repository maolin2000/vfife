# Hangzhou Bay Bridge unit with its piers, PUSHED BY THE STATIC SOLVER: case_24d
# with its 60 s explicit run replaced by Newton and arc length.
#
# WHY. case_24d finds the unit's live-load capacity by a slow dynamic ramp:
# 1.13 million explicit steps, 50 minutes, and past the peak a dynamic fall
# that its own contract says nothing holds. The same model, same mesh,
# section, tendons, piers and loads, goes here through
#   step 1  the dead load and the prestress, one Newton level;
#   step 2  the live pattern 20 (F_L, q_L) by arc length, k = 20 lambda,
# and stops at 0.38 m of middle-span deflection: 28 increments, 36 s.
#
# WHAT IT SHOWS THAT THE DYNAMIC RUN COULD NOT.
#   * The dead state is -23.18 mm at the middle span, not case_24d's -27.77.
#     Dynamic relaxation of the same two steps gives -23.181 (to 3e-6), so
#     this is the static equilibrium. case_24d applies the dead load at
#     t = 0 (on purpose: a ramp would leave the girder prestressed and
#     weightless) and the girder overshoots to -42.7 mm at 0.13 s -- 1.84
#     times its static sag -- which cracks some 4000 concrete fibre points
#     against 240 here. The 4.6 mm is that imprint; case_24d keeps it
#     because its contract is its own run's.
#   * The peak is k = 14.66 at -0.183 m, then the path SOFTENS to k = 12.78
#     at -0.27 m and hardens again to 14.27 at -0.390 m (with
#     OpenSees' Steel02; the law before it gave 14.79, 13.10 and 14.66,
#     its strands 3.45% over their own asymptote). A load-controlled
#     ramp cannot see the dip: it jumps it, which is where case_24d's
#     "limit point between 15.2 and 15.4" and its dynamic fall come from.
#   * Before the peak it is case_24d's curve less the imprint: -53.2 mm at
#     k = 5 (case_24d -59, of which 4.6 imprint), -162.3 mm at k = 14
#     (case_24d -158).
#
# WHERE IT STOPS AND WHY. Past the second peak the arc turns back down the
# elastic unloading line (every fibre strain decreasing) and no increment
# along the softening converges: at a peak where many fibres sit on the
# cracking and crushing kinks, the central-difference tangent averages the
# loading and unloading branches. The stop is set before that. (Since
# v1.0 an increment that turns back is refused rather than accepted; the
# first peak is sharp enough with the new steel02 that the corrector had
# settled on the unloading line there too.)
#
#   python benchmarks/generate_hzb_girder.py
#   vfife run cases/case_24g_hzb_static_pushover.yaml
