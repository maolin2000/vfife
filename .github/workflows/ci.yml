# Every change is checked automatically -- because the one way this fails is
# someone forgetting to press a button.
#
# The layers (the reasons are those of tests/test_cases.py: what rots and what
# is slow are not the same things):
#
#   fast        every push and pull request, Linux, Python 3.11. Nothing is
#               solved; it checks that the structure still holds: cases parse,
#               contracts match their monitors, elements read real Gmsh files,
#               output field names are valid, the compiled paths agree with
#               the reference paths bit for bit. Minutes.
#   platforms   the same tests on Windows and on the oldest and newest
#               supported Python, the oldest with the oldest dependency
#               versions pyproject allows. Public repository only (its
#               Actions minutes are free; the private repository's are not).
#   verify      solves every case under cases/ and checks its contract: "are
#               the answers still right". One job per case, since twenty
#               solves in one job overran its 120-minute budget, and a check
#               that times out is as green as one that is skipped. By hand
#               (Run workflow), and weekly in the public repository.
#
# The weekly run also installs the newest versions of every dependency, so an
# upstream release that breaks vfife is seen within a week, not by a user.
#
# No layer installs warp: the runners have no GPU, and a check that only runs
# on a GPU skips quietly and looks green. For the same reason every layer
# installs numba: the CPU kernels run on the runners, and without numba the
# assertions that the compiled path equals the scalar law would all skip.
# Everything here also runs locally: python tools/check_all.py.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"    # Mondays, 03:17 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fast:
    name: fast (Linux, Python 3.11)
    runs-on: ubuntu-latest
    # weekly only in the public repository: the private one pays for its minutes
    if: github.event_name != 'schedule' || github.repository == 'maolin2000/vfife'
    # about 5-10 minutes without the heavy tests; 30 leaves room for pip and numba compilation
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # plot, cpu and paraview on purpose: without them their tests skip, and a
        # skipped test protects nothing (numba alone is 44 assertions that the
        # fused kernels equal the scalar laws). gpu (warp) is not installed: no GPU.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot,cpu,paraview]"

      - name: Smoke test of the command line
        run: |
          python -m vfife --help > /dev/null
          python -m vfife list
          python -m vfife mesh tests/data/box_hexa8_v41.msh

      - name: Tests (default layer, without slow and heavy)
        # the default layer is about 75 CPU minutes; the tests over 3 s
        # (tests/heavy_tests.txt) are marked heavy and left to tools/check_all.py.
        # -n auto runs one worker per core, each single-threaded so that numba's
        # threads do not compete; -rfE lists the failures at the end
        env:
          NUMBA_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: pytest -q -n auto -m "not slow and not heavy" -rfE --tb=short --durations=15

      - name: Do the qualification lists still cite real tests
        run: |
          for f in qualification/*.yaml; do
            python -m vfife qualify check "$f"
          done

  platforms:
    name: fast (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    if: github.repository == 'maolin2000/vfife'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: "Windows, Python 3.11", os: windows-latest, python: "3.11", constraints: ""}
          - {label: "Linux, Python 3.10, oldest dependencies", os: ubuntu-latest, python: "3.10",
             constraints: "-c .github/minimum-versions.txt"}
          - {label: "Linux, Python 3.13", os: ubuntu-latest, python: "3.13", constraints: ""}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        # the same extras as the fast layer; the oldest-dependency job pins each
        # dependency to the lowest version pyproject allows
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot,cpu,paraview]" ${{ matrix.constraints }}

      - name: Tests (default layer, without slow and heavy)
        env:
          NUMBA_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          PYTHONIOENCODING: utf-8
        run: pytest -q -n auto -m "not slow and not heavy" -rfE --tb=short --durations=15

  verify:
    name: contract ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'maolin2000/vfife')
    strategy:
      # one red case does not cancel the others: the result is which still hold
      fail-fast: false
      matrix:
        # this list must equal cases/*.yaml minus the cases skipped by name in
        # tests/test_ci_layers.py, which checks it on every push: a new case
        # left out of it fails the fast layer.
        #
        # left out: case_15_chalmers_prc -- over an hour for one case (105 minutes
        # locally on two NumPy threads) and no faster with numba: the bonded
        # reinforcement and prestress path's per-step Python overhead dominates,
        # not the kernel. It comes back when that path is faster or it has a
        # cheaper form of verification (a coarser mesh, a contract to cracking).
        case:
          - case_01_beam_cantilever
          - case_02_truss_bar
          - case_03_mixed_frame
          - case_04_nafems_le10
          - case_05_space_truss_seismic
          - case_06_rc_column_cyclic
          - case_07_coupled_solid_truss
          - case_08_timoshenko_short_beam
          - case_09_connector_support
          - case_10_clamped_square_shell
          - case_11_fiber_rc_column_cyclic
          - case_12_ualberta_sf0b
          - case_12b_ualberta_sf0b_bond
          - case_12c_ualberta_sf0b_confined
          - case_13_pretensioned_beam
          - case_14_draped_tendon_balance
          - case_16_lee_frame
          - case_16b_lee_frame_arc_length
          - case_17_hinged_cylindrical_roof
          - case_18_bend45_cantilever
          - case_19_floating_beam
          - case_20_rolled_cantilever
          - case_21_vecchio_emara_frame
          - case_21b_vecchio_emara_cracked_shear
          - case_21c_vecchio_emara_static
          - case_22_cable_catenary
          - case_23_suspension_bridge
          - case_24_hzb_girder
          - case_24b_hzb_girder_modal
          - case_24c_hzb_girder_collapse
          - case_24d_hzb_girder_piers
          - case_24e_hzb_girder_bearings
          - case_24f_hzb_girder_bearings
          - case_24g_hzb_static_pushover
          - case_25_chen_hollow_slab
          - case_25b_chen_hollow_slab
          - case_26_moving_load_beam
          - case_26b_moving_load_influence
          - case_27_thermal_two_span
          - case_27b_thermal_eigenstress
          - case_28_confederation_trucks
          - case_28b_confederation_thermal
          - case_28c_confederation_uniform
          - case_28d_confederation_sdl
          - case_29_creep_bar
          - case_29b_relaxation
          - case_29c_shrinkage_bars
          - case_29d_fiber_creep_bar
          - case_29e_fiber_relaxation
          - case_29f_tendon_relaxation
          - case_29g_prestress_loss
          - case_30_kuang_control_beam
          - case_31_li_control_beam
          - case_32_bearing_laws
          - case_33_falling_beam
          - case_34_brittle_cantilever
          - case_35_spectrum_cantilever
          - case_36_multi_support_wave
          - case_37_pier_in_water
          - case_38_sprung_mass_crossing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # numba too: the cases run on their shipped backend (warp mapped to numba,
        # the runners have no GPU); that the compiled path equals the reference
        # path is asserted by the fast layer on every push
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot,cpu,paraview]"

      - name: Solve one case and check its contract
        run: pytest -q -m slow --durations=0 "tests/test_cases.py::test_a_case_solved_satisfies_its_contract[${{ matrix.case }}]"

      - name: Keep the diagnostics of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-failure-${{ matrix.case }}
          path: |
            results/
            /tmp/pytest-*/
          if-no-files-found: ignore
          retention-days: 14

  verify_rest:
    name: contract (the other slow tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'maolin2000/vfife')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # as above
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot,cpu,paraview]"

      - name: The slow tests that are not case contracts (bond, prestress, mixed meshes, erosion, ...)
        run: pytest -q -m slow --durations=0 --ignore=tests/test_cases.py

      - name: Keep the diagnostics of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-failure-rest
          path: |
            results/
            /tmp/pytest-*/
          if-no-files-found: ignore
          retention-days: 14
