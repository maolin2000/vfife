version: 1
classification: independent_reference
case: case_20_rolled_cantilever
reference: >-
  The elastica of a cantilever under an end couple M: with theta = M L / (E I)
  the tip is at u / L = sin(theta) / theta - 1, w / L = -(1 - cos(theta)) /
  theta, and at theta = 2 pi the beam is a circle with its tip on its root.
  Wu & Ting (2020), Proc. R. Soc. A 476:20200045, example 2, roll a solid
  beam this way; Bathe & Bolourchi (1979) and every finite-rotation paper
  since roll a beam element. The `time` monitor of a staged relaxation is
  the load-level index, and the levels below are m = M L / (2 pi E I) =
  0.25, 0.5, 0.75 and 1: a quarter, half, three-quarter and full circle.
  A stalled level fails the run itself, so reaching level 40 is not a
  separate check. Tolerances are absolute, in units of L: the solid beam is 16% strained
  in its outer fibres at the full turn and its depth is a third of the
  circle's radius there, where a linear-strain section is 2-3% of L from
  the elastica (see the case header); the load is exact.

metrics:
  - id: quarter_circle_u
    description: m = 0.25, theta = 90 degrees; u / L = 2 / pi - 1 = -0.36338
    source: monitor
    name: u_tip
    reduction: at
    against: time
    value: 10
    expect: {target: -0.36338, atol: 0.03}

  - id: quarter_circle_w
    description: m = 0.25; w / L = -2 / pi = -0.63662
    source: monitor
    name: w_tip
    reduction: at
    against: time
    value: 10
    expect: {target: -0.63662, atol: 0.03}

  - id: half_circle_u
    description: >-
      m = 0.5, theta = 180 degrees: the tip is directly below the root at a
      diameter's distance, u / L = -1 (the tip has come back over the root)
    source: monitor
    name: u_tip
    reduction: at
    against: time
    value: 20
    expect: {target: -1.0, atol: 0.03}

  - id: half_circle_w
    description: m = 0.5; w / L = -2 / pi = -0.63662 (the diameter, 2 R = L / pi)
    source: monitor
    name: w_tip
    reduction: at
    against: time
    value: 20
    expect: {target: -0.63662, atol: 0.03}

  - id: three_quarter_circle_u
    description: m = 0.75, theta = 270 degrees; u / L = -2 / (3 pi) - 1 = -1.21221
    source: monitor
    name: u_tip
    reduction: at
    against: time
    value: 30
    expect: {target: -1.21221, atol: 0.03}

  - id: three_quarter_circle_w
    description: m = 0.75; w / L = -2 / (3 pi) = -0.21221, the tip climbing back
    source: monitor
    name: w_tip
    reduction: at
    against: time
    value: 30
    expect: {target: -0.21221, atol: 0.035}

  - id: full_circle_u
    description: >-
      m = 1, theta = 360 degrees: the tip on the root, u / L = -1. The
      solid's section is a third of the circle's radius deep here; this
      mesh closes to 2.9% of L.
    source: monitor
    name: u_tip
    reduction: at
    against: time
    value: 40
    expect: {target: -1.0, atol: 0.035}

  - id: full_circle_w
    description: m = 1; w / L = 0, the tip level with the root
    source: monitor
    name: w_tip
    reduction: at
    against: time
    value: 40
    expect: {target: 0.0, atol: 0.02}
