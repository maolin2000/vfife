version: 1
case: case_21c_vecchio_emara_static
classification: public_benchmark
reference: >-
  Vecchio, F.J. and Emara, M.B., "Shear Deformations in Reinforced Concrete
  Frames", ACI Structural Journal 89(1), 1992, pp. 46-56: one-bay two-storey
  RC frame, 3500 mm span, 2000 mm storeys, all members 300 x 400 mm with
  4 + 4 No.20 (fy 418 MPa), f'c = 30 MPa, 700 kN on each column, pushed at
  the second storey to 155 mm. The measured load-deflection curve is
  verification/VecchioEmara_1992_frame.txt, digitised from Fig. 11 of Guner
  & Vecchio, ACI Structural Journal 107(1), 2010, which reproduces it; the
  area under its loading branch (44.8 kN.m) matches the 44.4 kN.m that paper
  quotes as the frame's total energy, which is the check on the digitising.

# --------------------------------------------------------------------------- #
#  case_21's contract, unchanged, for the same frame solved by Newton
#  (mode: static). Static against relaxation at the levels
#  read here: 296.8 / 296 kN at 30 mm, 332.0 / 333 at 100, 306.2 / 306 at
#  155, peak 345.7 / 346, energy 46.55 / 46.5 kN m. What follows is
#  case_21's own account of what the numbers mean.
# --------------------------------------------------------------------------- #
#  WHAT THIS CONTRACT ASSERTS, AND WHAT IT KNOWINGLY DOES NOT
# --------------------------------------------------------------------------- #
#  The curve has three parts and each is held for a different reason.
#
#  THE PLATEAU (75-155 mm) is the mechanism: four beam hinges and two column
#  bases, with P-delta eating into it (12% of the overturning moment at
#  ultimate, per Guner & Vecchio). The model is within 3% of the measurement
#  at 100, 125 and 155 mm (1.00 / 1.00 / 0.98). Held at 5%.
#
#  THE PEAK is 346 kN against 333 measured (1.04), and it comes at 50 mm
#  where the test's is at 80-100. Six of those percent are the mesh (8
#  elements per member; 16 gives 337 -- see the case file), so the peak is
#  held at 8%: tight enough that a section error shows, loose enough that
#  the known mesh effect does not. (One section with the bars at the mean
#  depth, the v0.2 form, gave 347: the beam/column split is worth 0.5%.)
#
#  THE RISING BRANCH is where the model is honestly wrong and says so: 1.15x
#  stiffer than the test at 30 mm. Vecchio & Emara measured that shear
#  deformation is 20% of this frame's total deformation. Strain penetration
#  at the joints (Priestley's Lsp, no free parameter) took the ratio from
#  1.33 to 1.17; the members' UNCRACKED shear flexibility (kappa G A
#  derived from E_c, no free parameter) takes it to 1.15; what is left is
#  cracked shear, which needs a reduced stiffness nobody has derived here
#  (a quarter of uncracked gives 1.10 -- see the case file). It is held as
#  a BAND, 1.05-1.25 at 30 mm, so that the record stays honest in both
#  directions: a model that drifted stiffer would fail, and so would one
#  that suddenly matched -- that would mean a missing mechanism had been
#  compensated by something else, and this file wants to know.
#
#  ENERGY to 155 mm: 46.5 kN.m against 44.8, +4%, held at 8%.

metrics:
  - id: reached_155mm
    description: The push reaches the test's 155 mm
    source: monitor
    name: drift
    reduction: peak_abs
    expect: {target: 0.155, rtol: 0.005}

  - id: plateau_at_100mm
    description: Net lateral load at 100 mm, the measured 333 kN (model 322; 332 before v1.0)
    source: monitor
    name: base_shear
    reduction: at
    against: drift
    value: 0.100
    expect: {target: -333000.0, rtol: 0.05}

  - id: plateau_at_155mm
    description: Net lateral load at 155 mm, the measured 311.5 kN (model 299; 306 before v1.0)
    source: monitor
    name: base_shear
    reduction: at
    against: drift
    value: 0.155
    expect: {target: -311500.0, rtol: 0.05}

  - id: peak_load
    description: >-
      Lateral capacity against the measured 333 kN; model 346 (1.04), of
      which ~6% is the 8-per-member mesh. Held at 8%.
    source: monitor
    name: base_shear
    reduction: peak_abs
    expect: {target: 333000.0, rtol: 0.08}

  - id: rising_branch_is_too_stiff_by_the_missing_shear
    description: >-
      Load at 30 mm: measured 257 kN, model 296 (1.15). Held as a band,
      1.05-1.25 of the measurement, because the excess is a mechanism this
      element does not have (shear deformation, 20% of this frame's total
      per Vecchio & Emara) and not a number to be tuned away.
    source: monitor
    name: base_shear
    reduction: at
    against: drift
    value: 0.030
    expect: {lower: -321000.0, upper: -270000.0}

  - id: energy_to_155mm
    description: >-
      Area under the load-deflection curve to 155 mm: measured 44.8 kN.m
      (the paper's 44.4), model 46.5.
    source: monitor
    name: base_shear
    reduction: energy
    against: drift
    from_origin: true
    expect: {target: 44800.0, rtol: 0.08}

  - id: residual
    description: Final equilibrium residual of the last Newton increment
    source: diagnostic
    name: residual
    reduction: final
    expect: {upper: 5.0e-4}
