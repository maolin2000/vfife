version: 1
case: case_28_confederation_trucks
classification: public_benchmark
reference: >-
  Ghali, A., Elbadry, M. and Megally, S. (2000). Two-year deflections of the
  Confederation Bridge. Canadian Journal of Civil Engineering 27: 1139-1149.
  Fig. 17 is the measured and predicted deflection profile of the 440 m girder
  of the P31-P32 portal frame with two trucks (blue 379 kN, grey 346 kN)
  parked side by side with their resultants at midspan; Figs. 8 and 9 are the
  geometry (250 m span, two 95 m overhangs, pier heights 60.98 and 68.58 m to
  a reference axis 1.52 m below the deck). The section comes from Dilger, W.H.
  and Langohr, D. (1997), CJCE 24: 898-907, Fig. 9, with its two undimensioned
  thicknesses calibrated on the gross-section table in Butcher, C. (2009),
  MASc thesis, Dalhousie University, Appendix E. Digitised from Fig. 17 at
  600 dpi: midspan 17.1 mm down, 6.5 and 6.8 at x = -/+60 m, 3.2 and 4.0 UP
  at -/+180 m, 5.4 and 7.6 up at the tips; Ghali's own analysis reads 13.7 mm
  at midspan.

# --------------------------------------------------------------------------- #
#  WHAT IS BEING CHECKED, AND WHAT IS NOT
# --------------------------------------------------------------------------- #
#  Not one number in the model is fitted to a deflection. The outline is read
#  off Dilger's Fig. 9; two thicknesses are fitted on Butcher's published
#  area/centroid/I and then predict all three within 4%; the haunch exponent
#  1.380 falls out of two published depths and reproduces Dilger's soffit
#  slope; E is the measured Ec(28) = 38.7 GPa; the axle loads and spacings are
#  Ghali's Fig. 15. The one guess is the pier wall thickness (0.6 m), which
#  moves midspan by 25% over a fourfold change -- so these metrics check the
#  GIRDER to a few percent and the pier only to that.
#
#  The girder nodes sit on the section centroid, which dips 4.3 m from midspan
#  to the pier; the resulting shallow arch is real and is what a beam element
#  is derived for. Ghali used a straight reference axis with explicit centroid
#  offsets. A straight axis with NO offsets -- the other thing a plain beam
#  element can do -- gives 22.4 mm at midspan, so the two idealisations
#  bracket the measurement (17.1) and his analysis (13.7) from both sides.
#
#  Step 2 parks the pair at midspan, which is why `final` is a published truck
#  position; `min` and `max` are over the 22-station sweep and are the
#  influence line.

metrics:
  - id: midspan_under_the_trucks
    description: >-
      The headline number of the test: 17.1 mm measured, 13.7 mm from Ghali's
      own analysis, 16.9 from this model. A fully independent reconstruction
      landing 1% from the measurement is luckier than it deserves -- the
      honest spread is the 13.7-to-22.4 bracket above -- but it is the number
      the case is for.
    source: monitor
    name: w_mid
    reduction: final
    expect: {target: -0.0171, rtol: 0.06}

  - id: the_quarter_point_east
    description: 6.8 mm down at x = +60 m, measured and modelled
    source: monitor
    name: w_q_east
    reduction: final
    expect: {target: -0.0068, rtol: 0.08}

  - id: the_quarter_point_west
    description: >-
      6.5 mm down at x = -60 m against the model's 7.1. The two quarter points
      differ because the piers do: P32 is 60.98 m and P31 68.58 m, so the
      frame is not symmetric and neither is the profile.
    source: monitor
    name: w_q_west
    reduction: final
    expect: {target: -0.0065, rtol: 0.12}

  - id: the_sign_changes_beyond_the_pier
    description: >-
      x = -180 m is on the cantilever, and it goes UP 3.2 mm while midspan goes
      down 17. That sign change is the portal frame: load the span and the
      joint rotation lifts everything outside it. A model that got the pier
      restraint badly wrong would not get this station's sign and size.
    source: monitor
    name: w_o_west
    reduction: final
    expect: {target: 0.0032, rtol: 0.15}

  - id: the_west_tip_lifts
    description: 5.4 mm up measured at x = -220 m, 5.8 modelled
    source: monitor
    name: w_tip_west
    reduction: final
    expect: {target: 0.0054, rtol: 0.12}

  - id: the_east_tip_lifts
    description: >-
      5.2 mm up modelled. Fig. 17's measured curve turns sharply up in its last
      few metres to about 7.6, which neither this model nor Ghali's (about 3.5)
      reproduces -- the drop-in beam bears there and is idealised away in both.
      The metric is written on the model against the cross-checking plane frame
      in benchmarks/generate_confederation.py, with the measurement recorded
      here rather than asserted.
    source: monitor
    name: w_tip_east
    reduction: final
    expect: {target: 0.00522, rtol: 0.05}

  - id: influence_line_peak_at_the_west_tip
    description: >-
      Over the 22-station sweep the west tip's worst deflection is 27.2 mm
      down, with the pair standing on that cantilever at x = -200 m -- 1.6x
      what the same trucks do at midspan, on a structure whose midspan is
      250 m and whose cantilever is 95.
    source: monitor
    name: w_tip_west
    reduction: min
    expect: {target: -0.02724, rtol: 0.04}

  - id: and_at_the_east_tip
    description: >-
      26.0 mm, 4.6% less than the west tip for the same load at the mirror
      station: the taller pier P31 is the more flexible one, and it is the
      SHORTER pier's cantilever that deflects more. That asymmetry is the only
      thing in this case that the pier heights alone decide.
    source: monitor
    name: w_tip_east
    reduction: min
    expect: {target: -0.02600, rtol: 0.04}

  - id: the_tip_lifts_most_when_the_load_is_a_span_away
    description: >-
      The west tip's largest uplift over the sweep, 9.75 mm, comes with the
      pair at x = -40 m and not at midspan: the influence line for tip uplift
      peaks on the near side of the span.
    source: monitor
    name: w_tip_west
    reduction: max
    expect: {target: 0.00975, rtol: 0.05}

  - id: the_quarter_points_own_influence_line
    description: x = +60 m carries 9.23 mm with the pair at x = +40 m
    source: monitor
    name: w_q_east
    reduction: min
    expect: {target: -0.00923, rtol: 0.05}

  - id: statics_at_the_piers
    description: >-
      With the pair at midspan the two pier bases carry 347 and 353 kN of the
      725 kN on the bridge -- nearly half each, the small difference being the
      unequal pier stiffness. (The 3% shortfall against 725 was the relaxation
      residual summed over 101 nodes, not a lost load: with the trucks at the
      east tip the same sum read 0.4825 of 725, which is exactly the fraction
      of the axles still on the 440 m girder. Since 1.7 the case runs on the
      implicit static solver and the west base reads 361 kN, the 3% back.)
    source: monitor
    name: R_base32
    reduction: final
    expect: {target: 3.472e+5, rtol: 0.05}
