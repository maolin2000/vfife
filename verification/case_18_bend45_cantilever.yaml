version: 1
classification: independent_reference
case: case_18_bend45_cantilever
reference: >-
  Bathe & Bolourchi (1979), "Large displacement analysis of three-dimensional
  beam structures", IJNME 14:961-986, the 45-degree bend: R = 100, 1 x 1
  section, E = 1e7, nu = 0, tip load 600 normal to the plane of the bend,
  eight elements; tip displacement (-13.4, -23.5, 53.4). The three-level
  table is the Abaqus Benchmarks Manual, NAFEMS 3DNLG-5 "Large deflection of
  a curved elastic cantilever under transverse end load", element B33 (an
  Euler-Bernoulli element like this one): P = 300 (-7.188, -12.19, 40.50),
  450 (-10.93, -18.76, 48.73), 600 (-13.74, -23.85, 53.63). Simo & Vu-Quoc
  (1986) report (-13.48, -23.48, 53.37) and Cardona & Geradin (1988)
  (-13.6, -23.5, 53.5) at 600.

metrics:
  # ---- the Abaqus table, read at the load through the root reaction -------
  - id: u_at_300
    description: >-
      Tip x at P = 300 (reaction -300 at the root): Abaqus B33 -7.188, this
      model -7.115 (1.0%). The smallest of the three components, the one the
      torsion constant moves most, and the widest band of the set.
    source: monitor
    name: u
    reduction: at
    against: Rz
    value: -300.0
    expect: {target: -7.188, rtol: 0.015}

  - id: v_at_300
    source: monitor
    name: v
    reduction: at
    against: Rz
    value: -300.0
    expect: {target: -12.19, rtol: 0.01}

  - id: w_at_300
    source: monitor
    name: w
    reduction: at
    against: Rz
    value: -300.0
    expect: {target: 40.50, rtol: 0.01}

  - id: u_at_450
    source: monitor
    name: u
    reduction: at
    against: Rz
    value: -450.0
    expect: {target: -10.93, rtol: 0.015}

  - id: v_at_450
    source: monitor
    name: v
    reduction: at
    against: Rz
    value: -450.0
    expect: {target: -18.76, rtol: 0.01}

  - id: w_at_450
    source: monitor
    name: w
    reduction: at
    against: Rz
    value: -450.0
    expect: {target: 48.73, rtol: 0.01}

  - id: u_at_600
    description: >-
      Abaqus -13.74, this model -13.64 (0.7%). The old kinematics gave -12.8
      here (7%): the in-plane component across the chord is where a frame
      that cannot see its nodes' twist shows first.
    source: monitor
    name: u
    reduction: final
    expect: {target: -13.74, rtol: 0.015}

  - id: v_at_600
    source: monitor
    name: v
    reduction: final
    expect: {target: -23.85, rtol: 0.01}

  - id: w_at_600
    description: >-
      Abaqus 53.63, this model 53.64. The old kinematics gave 52.4 (2%
      stiff); with sixteen elements this model gives 53.48.
    source: monitor
    name: w
    reduction: final
    expect: {target: 53.63, rtol: 0.01}

  # ---- the 1979 answer, with its own torsion constant ----------------------
  - id: the_1979_tip
    description: >-
      Bathe & Bolourchi's w = 53.4 with the polar moment as the torsion
      constant (their u, v are 1.8% and 1.3% from this model for the same
      reason; w is the component torsion moves least). Held to 1%.
    source: monitor
    name: w
    reduction: final
    expect: {target: 53.4, rtol: 0.01}

  - id: the_load_is_carried_to_the_root
    description: the z reaction at the clamp is minus the applied 600, exactly
    source: monitor
    name: Rz
    reduction: final
    expect: {target: -600.0, rtol: 1.0e-6}

  - id: residual
    description: Final equilibrium residual (static since 1.5)
    source: diagnostic
    name: residual
    reduction: final
    expect: {upper: 1.0e-5}
