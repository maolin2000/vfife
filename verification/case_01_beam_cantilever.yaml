version: 1
case: case_01_beam_cantilever
classification: analytical
reference: Euler--Bernoulli cantilever, u=PL^3/(3EI)
metrics:
  - id: tip_uz
    description: Closed-form vertical tip displacement
    source: monitor
    name: tip_uz
    reduction: final
    expect: {target: -1.6666666667e-5, rtol: 2.0e-6, atol: 1.0e-12}
  - id: root_fz
    description: Vertical equilibrium reaction
    source: monitor
    name: root_fz
    reduction: final
    expect: {target: 1000.0, rtol: 2.0e-6, atol: 1.0e-6}
  - id: residual
    source: diagnostic
    name: residual
    reduction: final
    expect: {upper: 1.0e-10}
