version: 1
case: case_12b_ualberta_sf0b_bond
classification: public_benchmark
reference: >-
  The same specimen as case_12 -- University of Alberta SF-0B, Muhammad Hafiz
  Asher, MSc thesis, September 2025 -- with the tension layer switched from
  perfect bond to `bond_ceb` (fib Model Code 2010 pull-out, good confinement,
  f'c = 44 MPa). Measured record: verification/UAlberta_SF-0B_four_point.txt.
  This is the A/B partner of case_12 and exists to measure what the bond-slip
  path changes on a case where the perfect-bond answer is already known.

# --------------------------------------------------------------------------- #
#  WHAT IT MEASURES
# --------------------------------------------------------------------------- #
#  Held against case_12, everything is identical except the `bond` block on the
#  tension reinforcement, so the difference between them is the interface and
#  nothing else. Driven as case_12 is, to 16.0 mm of imposed displacement,
#  19.22 mm at midspan -- the deflection at which SF-0B was measured to peak.
#
#      midspan (mm)     0.93   2.77   4.60   6.39   9.2    13.1   19.2
#      case_12          90.5  174.5  240.9  293.6  341.0  352.3  360.1
#      this case        90.6  169.3  238.2  292.6  337.3  351.6  360.4
#      measured         52.1  127.9  198.5  260.1  327.0  370.6  398.6
#
#  Bond-slip is 1-3% softer than perfect bond in the middle of the path and
#  lands within 0.1% of it at the end: 360.4 against 360.1 kN. That is the
#  right size for a beam whose bars are this well anchored (216 mm bearing
#  plates over the bars at each support). The ratio to the measured 399 kN
#  is 0.90 for the same reasons as case_12, which carries the account.
#
#  IT USED TO STOP AT ITS PEAK. An earlier version was driven to 8.0 mm only,
#  because a 14-step version's load step 11 had stopped at a residual of
#  1e-2 on the 8 000-iteration budget. Rerun on the current code the same
#  steps converge with no budget touched -- the bonded fixes of v0.1
#  and the removal of `host_deduction` had already removed whatever
#  made the descent slow, and the note outlived its cause.
#
#  IT ALSO USED TO CRUSH. Before v0.1 both this case and case_12
#  peaked near 10 mm and came down, because the compression curve had no
#  length scale; case_12's contract has the mesh study and the crushing
#  energy that fixed it. This case inherits `Gc: 35.0e3` unchanged, so the
#  A/B is still one line.
#
#  The thesis reports the crack pattern at service load: nine flexural
#  cracks, mean spacing about 79 mm, 0.17 mm wide at P_s = 174 kN. That is
#  the sharpest bond validation the record offers and it is NOT asserted --
#  there is no monitor reduction for a crack pattern, and inventing one to
#  fit would be worse than leaving the gap named.

# THE TARGETS BELOW WERE REFRESHED, AND WHY. They had drifted -- up to 0.8%
# here -- while every check still passed, because the band is 3%. This case is
# DISPLACEMENT controlled, and v0.1 changed how a prescribed
# displacement ramps into each load level (the `approach` blend that stopped a
# level from starting with a step discontinuity at the driven nodes); the
# case_12 family was never re-verified against it. The values here are the
# current model's, re-measured.

metrics:
  - id: reaction_left_peak
    # Half of the measured 399 kN. This model: 180.1 kN, ratio 0.903.
    description: Peak left reaction against the measured peak load
    source: monitor
    name: P_L
    reduction: peak_abs
    expect: {target: 179605.0, rtol: 0.03}

  - id: reaction_right_peak
    # 180.4 kN; the left-right spread at the end is 0.2%.
    description: Peak right reaction against the measured peak load
    source: monitor
    name: P_R
    reduction: peak_abs
    expect: {target: 178997.0, rtol: 0.03}

  - id: midspan_deflection
    description: Midspan deflection at the end of the imposed displacement
    source: monitor
    name: mid
    reduction: peak_abs
    expect: {target: 0.019165, rtol: 0.02, atol: 1.0e-5}

  # ---- the shape, against case_12's (147.9 / 180.7 kN, 2784 J) ---------- #
  - id: load_at_yield_deflection
    # 1.0% under perfect bond: the interface's whole effect at yield
    description: Left reaction where the midspan deflection first reaches 6.5 mm
    source: monitor
    name: P_L
    reduction: at
    against: mid
    value: -0.0065
    expect: {target: 147662.0, rtol: 0.03}

  - id: load_at_measured_peak_deflection
    # 179.9 kN, 0.4% under perfect bond: the bars are anchored well enough
    # that the interface costs almost nothing at the end of the path
    description: Left reaction where the midspan deflection reaches 19.0 mm
    source: monitor
    name: P_L
    reduction: at
    against: mid
    value: -0.0190
    expect: {target: 178770.0, rtol: 0.03}

  - id: work_to_end
    description: Work done by the left reaction over the imposed path, from the origin
    source: monitor
    name: P_L
    reduction: energy
    against: mid
    from_origin: true
    expect: {target: 2775.3, rtol: 0.03}

  - id: residual
    description: Final equilibrium residual after staged relaxation
    source: diagnostic
    name: residual
    reduction: final
    expect: {upper: 1.0e-3}

# --------------------------------------------------------------------------- #
#  WHAT THIS CASE FOUND ON THE WAY, IN ORDER
# --------------------------------------------------------------------------- #
#  Its first version stopped at 4.5 mm and blamed an interface stability
#  bound. Tested with the iteration budget scaled, a smaller time step made
#  it fail EARLIER, and what was there instead was three defects in this
#  project's bonded path, all fixed and all pinned by tests:
#
#  1. The bar dofs were in neither the convergence residual nor the kinetic
#     energy kinetic damping resets on (core/solver.py). The host settled
#     against bars still in motion: 37.1 kN and a 71.7% left-right split
#     on the first load step, against 66.8 kN and 1.1% run to equilibrium.
#  2. `bond_ceb` kept its unloading anchor on the iteration path. A bar
#     started 20 um off in a rigid host settled at 300 um of permanent slip
#     (tests/test_bonded_convergence.py). Every bond law is now a staging
#     TrialState, restored to the committed point on every evaluation.
#  3. With the anchor held still the reversal rule showed a force jump
#     (-685 to +810 kPa in one step on a sign reversal) and a limit cycle.
#     The line is now held inside the envelope at the current slip, and the
#     unloading slope is the loading tangent rather than an s1 secant 63x
#     softer -- below 0.22 s1 the old law gained energy on a small cycle.
#
#  Its second version stopped at the "yield point" with the same wall as
#  case_12, which turned out to be `host_deduction: E_c` on a cracking
#  section (case_12's contract has the account). With that removed the
#  bonded and perfect-bond models agree to 0.3% at the peak.
#
#  A pure-bending specimen of this section with bond-slip was not usable: in
#  pure bending the bar force is constant to the free end faces, nothing
#  anchored the bar there, and it pulled out at 44 kN.m. The bonded path now
#  has an end-anchorage device, `anchorage: ends` on the assignment
#  (tests/test_bonded_anchorage.py), which ties the bar's
#  free ends to the host the way a plate or a hook does. This case does not
#  use it, on purpose: its bars are anchored by the concrete beyond the
#  supports where their force is small, and the A/B against case_12 is to
#  stay one line.
